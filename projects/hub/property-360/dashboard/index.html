              itemBtn.dataset.wired = '1';
              itemBtn.addEventListener('click', function () { handlePrivacyAction(this, propertyId, bodyEl, includeReviewed, grouped); });
            });
          } else if (this.dataset.clusterAction === 'bulk-confirm') {
            bulkReviewPrivacyCluster(idx, 'confirm', propertyId, bodyEl, includeReviewed, grouped);
          } else if (this.dataset.clusterAction === 'bulk-reject') {
            bulkReviewPrivacyCluster(idx, 'reject', propertyId, bodyEl, includeReviewed, grouped);
          }
        });
      });
    }

    // Bulk-confirm/reject a whole cluster in one call — POST
    // /flagged-queue/bulk-review, condition 4/6. The server re-verifies
    // every id fresh (still-flagged, still-unreviewed, still has a shared
    // matched term) before acting on it, so `failed` can legitimately be
    // non-empty even right after loading this view — reported honestly,
    // never collapsed into a single pass/fail result.
    async function bulkReviewPrivacyCluster(idx, action, propertyId, bodyEl, includeReviewed, grouped) {
      const cluster = lastPrivacyClusters[idx];
      if (!cluster) return;
      const label = action === 'confirm' ? 'Confirm' : 'Reject';
      if (!confirm(label + ' all ' + cluster.count + ' item' + (cluster.count === 1 ? '' : 's') + ' in this group?')) return;

      const items = cluster.items.map(function (i) { return { id: i.id, item_type: i.item_type }; });
      try {
        const res = await fetch('/api/maintenance-history/flagged-queue/bulk-review', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
          body: JSON.stringify({ items: items, action: action }),
        });
        const body = await res.json();
        if (!res.ok) {
          alert(body.error || 'Could not complete the bulk action.');
          return;
        }
        const succeededCount = body.succeeded ? body.succeeded.length : 0;
        const failedCount = body.failed ? body.failed.length : 0;
        showToast(succeededCount + ' saved' +
          (failedCount ? ', ' + failedCount + ' skipped (already changed since this list loaded — check them individually).' : '.'));
        loadPrivacyReview(propertyId, bodyEl, includeReviewed, grouped);
      } catch (e) {
        alert('Network error.');
      }
    }

    async function handlePrivacyAction(btn, propertyId, bodyEl, includeReviewed, grouped) {
      const action = btn.dataset.action;
      const id = btn.dataset.claimId;
      // Governance fix, 2026-09-03 — see renderPrivacySnapshotEvent's own
      // comment above for why the form fields are read the same way for
      // both item types (same element id convention) while what gets
      // sent, and to which route, differs.
      const itemType = btn.dataset.itemType || 'claim';

      if (action === 'toggle-correct' || action === 'toggle-reject') {
        const form = document.getElementById((action === 'toggle-correct' ? 'correct-form-' : 'reject-form-') + id);
        const isOpen = form.classList.toggle('visible');
        btn.textContent = isOpen ? 'Cancel' : (action === 'toggle-correct' ? 'Correct' : 'Reject');
        return;
      }

      const payload = { action: action };
      if (itemType === 'snapshot_event') {
        if (action === 'correct') {
          payload.summary = document.getElementById('correct-text-' + id).value;
          payload.event_date = document.getElementById('correct-date-' + id).value || null;
          payload.reviewer_notes = document.getElementById('correct-notes-' + id).value || null;
        } else if (action === 'reject') {
          payload.reviewer_notes = document.getElementById('reject-notes-' + id).value || null;
        }
      } else {
        if (action === 'correct') {
          payload.claim_text = document.getElementById('correct-text-' + id).value;
          payload.claim_date = document.getElementById('correct-date-' + id).value || null;
          const outcomeEl = document.getElementById('correct-outcome-' + id);
          if (outcomeEl && outcomeEl.value) payload.outcome_level = Number(outcomeEl.value);
          payload.reviewer_notes = document.getElementById('correct-notes-' + id).value || null;
        } else if (action === 'reject') {
          payload.reviewer_notes = document.getElementById('reject-notes-' + id).value || null;
        }
      }

      const endpoint = itemType === 'snapshot_event'
        ? '/api/maintenance-history/snapshot-events/' + encodeURIComponent(id) + '/review'
        : '/api/maintenance-history/claims/' + encodeURIComponent(id) + '/review';

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(payload),
        });
        const body = await res.json();
        if (!res.ok) {
          alert(body.error || 'Could not save that review.');
          return;
        }
        showToast(action === 'confirm' ? 'Saved — marked as confirmed.' : action === 'correct' ? 'Saved — marked as corrected.' : 'Saved — marked as rejected.');
        loadPrivacyReview(propertyId, bodyEl, includeReviewed, grouped);
      } catch (e) {
        alert('Could not save that review.');
      }
    }

    // ────────────────────────────────────────────────────────────────
    // Admin Users section (admin-only) — property-360-SPEC.md's "A
    // Maintenance Users section (admin-only)... the exact content of
    // today's standalone 'Users' tab, folded into this page." Calls the
    // existing, unchanged /api/maintenance-history/users GET/POST/
    // PATCH/DELETE routes directly — nothing new added to
    // maintenance-history/router.js for this section. VALID_ROLES
    // includes director_of_operations (the old standalone Users tab's
    // dropdown only offered admin/reviewer — a real gap versus what the
    // backend has actually allowed since Mason's conditional approval;
    // fixed here rather than carried forward).
    // ────────────────────────────────────────────────────────────────
    const VALID_ROLES = ['admin', 'reviewer', 'director_of_operations'];
    function formatRole(role) {
      const map = { admin: 'Admin', reviewer: 'Reviewer', director_of_operations: 'Director of Operations' };
      return map[role] || role;
    }

    async function loadUsers(bodyEl, myEmail) {
      bodyEl.innerHTML = '<div class="empty">Loading&hellip;</div>';
      try {
        const res = await fetch('/api/maintenance-history/users', { credentials: 'include' });
        const users = await res.json();
        if (!res.ok) { bodyEl.innerHTML = '<div class="empty">Couldn\'t load Users right now.</div>'; return; }

        let html = '<div class="grant-form">' +
          '<input type="email" id="grant-email" placeholder="name@rinconmanagement.com">' +
          '<select id="grant-role">' + VALID_ROLES.map(function (r) { return '<option value="' + r + '">' + formatRole(r) + '</option>'; }).join('') + '</select>' +
          '<button class="btn-primary" id="grant-btn">Grant access</button>' +
          '</div><div id="grant-msg" style="font-size:12px;margin-bottom:10px;"></div>';

        if (!users.length) {
          html += '<div class="empty">No one has Maintenance History access yet.</div>';
        } else {
          html += '<div class="table-scroll users-table"><table><thead><tr><th>Person</th><th>Role</th><th>Access Granted</th><th></th></tr></thead><tbody>';
          users.forEach(function (u) {
            const isMe = myEmail && u.email === myEmail;
            html += '<tr data-email="' + escapeHtml(u.email) + '">' +
              '<td>' + escapeHtml(u.name || u.email) + (isMe ? ' <span style="color:#9ca3af;font-size:11px;">(you)</span>' : '') +
              '<div style="font-size:11.5px;color:#9ca3af;">' + escapeHtml(u.email) + '</div></td>' +
              '<td><select class="role-select">' + VALID_ROLES.map(function (r) { return '<option value="' + r + '"' + (r === u.role ? ' selected' : '') + '>' + formatRole(r) + '</option>'; }).join('') + '</select></td>' +
              '<td style="color:#6b7280;">' + formatDateTime(u.granted_at) + '</td>' +
              '<td>' + (!isMe ? '<button class="btn btn-reject remove-user-btn">Remove</button>' : '') + '</td>' +
              '</tr>';
          });
          html += '</tbody></table></div>';
        }
        bodyEl.innerHTML = html;

        document.getElementById('grant-btn').addEventListener('click', async function () {
          const email = document.getElementById('grant-email').value.trim();
          const role = document.getElementById('grant-role').value;
          const msgEl = document.getElementById('grant-msg');
          if (!email) return;
          msgEl.style.color = '#6b7280';
          msgEl.textContent = 'Adding…';
          try {
            const grantRes = await fetch('/api/maintenance-history/users', {
              method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
              body: JSON.stringify({ email: email, role: role }),
            });
            const grantBody = await grantRes.json();
            if (!grantRes.ok) {
              msgEl.style.color = '#dc2626';
              msgEl.textContent = grantBody.error || 'Could not grant access.';
              return;
            }
            loadUsers(bodyEl, myEmail);
          } catch (e) {
            msgEl.style.color = '#dc2626';
            msgEl.textContent = 'Network error.';
          }
        });

        bodyEl.querySelectorAll('tr[data-email]').forEach(function (row) {
          const email = row.getAttribute('data-email');
          row.querySelector('.role-select').addEventListener('change', async function (e) {
            try {
              const patchRes = await fetch('/api/maintenance-history/users/' + encodeURIComponent(email), {
                method: 'PATCH', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
                body: JSON.stringify({ role: e.target.value }),
              });
              if (!patchRes.ok) {
                const patchBody = await patchRes.json().catch(function () { return {}; });
                alert(patchBody.error || 'Could not update role.');
                loadUsers(bodyEl, myEmail);
              } else {
                showToast('Role updated.');
              }
            } catch (err) {
              alert('Network error.');
              loadUsers(bodyEl, myEmail);
            }
          });
          const removeBtn = row.querySelector('.remove-user-btn');
          if (removeBtn) {
            removeBtn.addEventListener('click', async function () {
              if (!confirm('Remove ' + email + '’s Maintenance History access?')) return;
              try {
                const delRes = await fetch('/api/maintenance-history/users/' + encodeURIComponent(email), { method: 'DELETE', credentials: 'include' });
                const delBody = await delRes.json().catch(function () { return {}; });
                if (!delRes.ok) { alert(delBody.error || 'Could not remove access.'); return; }
                loadUsers(bodyEl, myEmail);
              } catch (err) {
                alert('Network error.');
              }
            });
          }
        });
      } catch (e) {
        bodyEl.innerHTML = '<div class="empty">Couldn\'t load Users right now.</div>';
      }
    }

    // ────────────────────────────────────────────────────────────────
    // Maintenance section assembly — summary +
    // Needs Privacy Review (collapsed, added only after the role check
    // above resolves in favor of a PRIVACY_REVIEW_ROLES role).
    // ────────────────────────────────────────────────────────────────
    function maintenanceSectionHtml(card) {
      if (!card) return ''; // no Maintenance History access at all — no section, no hint it exists
      return '<div class="card" id="maintenance-section">' +
        '<div class="section-title">Maintenance</div>' +
        renderMaintenanceSummary(card) +
        '<details class="subsection" id="snapshot-details">' +
        '<summary>Maintenance History Snapshot</summary>' +
        '<div class="subsection-body" id="snapshot-body"></div>' +
        '</details>' +
        '</div>';
    }

    // ────────────────────────────────────────────────────────────────
    // Archive Search widget — compliance/archive-search-property-360-
    // embed-owner-risk-acceptance.md, -asimov-confirmation.md,
    // -mason-confirmation.md (both CLEARED WITH CONDITIONS). Placed
    // directly under the Maintenance section above (which itself ends in
    // Maintenance Notes), alongside — not replacing — the Complaint
    // Tracking / Issues section mounted near the top of this page.
    //
    // Gated on data.archive_search_access (property-360/router.js's own
    // real searcher/admin role check, run in-process via
    // attachArchiveSearchRole — imported unmodified from archive-
    // search/router.js, same compose-only pattern as every other card
    // on this page). This function returns '' — no section, no hint it
    // exists — when that flag is false, same discipline as
    // maintenanceSectionHtml above.
    //
    // Search input + results list + "open full message," wired to
    // archive-search's own already-gated GET /api/archive-search/search
    // and GET /api/archive-search/message/:id — not a new API, not a
    // second access check invented here. Those two routes independently
    // re-verify the same searcher/admin role on every call, so this
    // widget's rendering is a convenience, not the real gate.
    // ────────────────────────────────────────────────────────────────
    function archiveSearchSectionHtml(hasAccess) {
      if (!hasAccess) return ''; // no Archive Search role — no section, no hint it exists
      return '<div class="card" id="archive-search-section">' +
        '<div class="section-title">Archive Search</div>' +
        '<div class="as-search-row">' +
        '<input type="text" id="asSearchInput" autocomplete="off" placeholder="Search archived Missive correspondence&hellip;">' +
        '</div>' +
        '<div class="as-hint">Searches the same screened archive as Archive Search &mdash; not limited to this property.</div>' +
        '<div class="as-results" id="asResults"></div>' +
        '</div>';
    }

    // A short, dependency-free highlighter for the search term inside a
    // snippet/subject — cosmetic only; the real matching already happened
    // server-side (missive_message_intake_search_safe's full-text search).
    // Escapes first, then wraps whole-word-ish matches, so this can never
    // introduce unescaped HTML from message content.
    function asHighlight(text, query) {
      var escaped = escapeHtml(text);
      var terms = String(query || '').trim().split(/\s+/).filter(Boolean).map(function (t) {
        return t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      });
      if (!terms.length) return escaped;
      var re = new RegExp('(' + terms.join('|') + ')', 'ig');
      return escaped.replace(re, '<mark>$1</mark>');
    }

    function asResultRow(r, query) {
      return '<div class="as-result" data-message-id="' + escapeHtml(r.id) + '">' +
        '<div class="as-result-top">' +
        '<span class="as-result-subject">' + asHighlight(r.subject || '(no subject)', query) + '</span>' +
        '<span class="as-result-date">' + formatDateTime(r.delivered_at) + '</span>' +
        '</div>' +
        (r.from_address ? '<div class="as-result-from">' + escapeHtml(r.from_address) + '</div>' : '') +
        (r.snippet ? '<div class="as-result-snippet">' + asHighlight(r.snippet, query) + '</div>' : '') +
        '</div>';
    }

    // Wires the search box: debounced fetch against the real, already-
    // gated search route, and a click-to-expand full message view inline
    // below whichever result was clicked (no modal — matches this page's
    // existing <details>-based expand pattern elsewhere rather than
    // inventing new overlay UI). Fails quietly on a network error, same
    // convention as lib/global-search-widget.js's own hub-wide search box.
    function wireArchiveSearchSection() {
      var input = document.getElementById('asSearchInput');
      var results = document.getElementById('asResults');
      if (!input || !results) return; // no access — section wasn't rendered

      var debounceTimer = null;
      var currentQuery = '';
      var openMessageId = null;

      function runSearch(q) {
        fetch('/api/archive-search/search?q=' + encodeURIComponent(q), { credentials: 'include' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (body) {
            if (q !== currentQuery || !body) return; // a newer keystroke already fired — drop this stale response
            openMessageId = null;
            if (!body.results || !body.results.length) {
              results.innerHTML = '<p class="sub" style="margin:4px 0 0;">No archived messages match &ldquo;' + escapeHtml(q) + '&rdquo;.</p>';
              return;
            }
            results.innerHTML = body.results.map(function (r) { return asResultRow(r, q); }).join('') +
              (body.has_more ? '<p class="sub" style="margin:6px 0 0;">More results exist &mdash; refine your search to narrow it down.</p>' : '');
          })
          .catch(function () { /* search is a convenience on this page; fail quietly, same as the hub-wide search widget */ });
      }

      input.addEventListener('input', function () {
        var q = input.value.trim();
        currentQuery = q;
        clearTimeout(debounceTimer);
        if (!q) { results.innerHTML = ''; return; }
        debounceTimer = setTimeout(function () { runSearch(q); }, 250);
      });

      // Event delegation — result rows (and their message-body expansions)
      // are re-rendered on every search, so one listener on the container
      // handles all of them rather than re-binding per row.
      results.addEventListener('click', function (e) {
        var row = e.target.closest ? e.target.closest('.as-result') : null;
        if (!row) return;
        var id = row.getAttribute('data-message-id');
        var existingBody = row.nextElementSibling;
        if (existingBody && existingBody.classList && existingBody.classList.contains('as-message-body') && openMessageId === id) {
          // Already open — collapse it.
          existingBody.remove();
          openMessageId = null;
          return;
        }
        // Collapse any other open message first — one open at a time.
        var prevOpen = results.querySelector('.as-message-body');
        if (prevOpen) prevOpen.remove();

        var bodyEl = document.createElement('div');
        bodyEl.className = 'as-message-body';
        bodyEl.textContent = 'Loading…';
        row.insertAdjacentElement('afterend', bodyEl);
        openMessageId = id;

        fetch('/api/archive-search/message/' + encodeURIComponent(id), { credentials: 'include' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (msg) {
            if (!msg || openMessageId !== id) return;
            bodyEl.innerHTML = escapeHtml(msg.body_text || '(no message body on file)') +
              (msg.missive_link ? '<div style="margin-top:8px;"><a href="' + escapeHtml(msg.missive_link) + '" target="_blank" rel="noopener">Open in Missive &rarr;</a></div>' : '');
          })
          .catch(function () {
            if (openMessageId === id) bodyEl.textContent = "Couldn't load this message right now.";
          });
      });
    }

    // ────────────────────────────────────────────────────────────────
    // Multi-year maintenance snapshot subsection — property-360-SPEC.md
    // "Multi-year maintenance snapshot": a short, chronological list of
    // historical AppFolio bill-history facts for this property (up to 5
    // years back, one line each — date, summary, amount), populated by
    // maintenance-history/backfill-maintenance-snapshot.js. Reads ONLY
    // the new, gated GET /api/maintenance-history/property/:property_id/
    // snapshot route, which itself reads ONLY
    // maintenance_snapshot_events_decision_safe (never the raw table) —
    // flagged/rejected rows never reach this page. Gated by the same
    // requireMaintenanceHistoryAccess as the Maintenance summary card
    // itself (ANY real role), not the narrower PRIVACY_REVIEW_ROLES gate
    // Privacy Review below uses — so, unlike Privacy Review, this
    // subsection needs no extra role lookup before rendering; the
    // Maintenance card already being present is enough. Collapsed by
    // default, lazy-loaded on first open — same phone-friendly pattern
    // as Privacy Review and the old Budget section it's modeled on.
    // ────────────────────────────────────────────────────────────────
    async function loadMaintenanceSnapshot(propertyId, bodyEl) {
      bodyEl.innerHTML = '<div class="empty">Loading&hellip;</div>';
      try {
        const res = await fetch('/api/maintenance-history/property/' + encodeURIComponent(propertyId) + '/snapshot', { credentials: 'include' });
        const rows = await res.json();
        if (!res.ok) {
          bodyEl.innerHTML = '<div class="empty">Couldn\'t load the maintenance snapshot right now.</div>';
          return;
        }
        if (!rows.length) {
          bodyEl.innerHTML = '<div class="empty">No historical maintenance bill records for this property yet.</div>';
          return;
        }
        let html = '<div class="table-scroll"><table><thead><tr><th>Date</th><th>Summary</th><th>Amount</th></tr></thead><tbody>';
        rows.forEach(function (r) {
          html += '<tr><td>' + formatDate(r.event_date) + '</td><td>' + escapeHtml(r.summary) + '</td><td>' + formatMoney(r.amount) + '</td></tr>';
        });
        html += '</tbody></table></div>';
        bodyEl.innerHTML = html;
      } catch (e) {
        bodyEl.innerHTML = '<div class="empty">Couldn\'t load the maintenance snapshot right now.</div>';
      }
    }

    // ────────────────────────────────────────────────────────────────
    // Open tickets — the actual list behind the Open tickets stat above.
    // Reads GET /api/maintenance-history/property/:property_id/open-tickets
    // (new route, router.js), which uses the exact same open definition
    // as open_ticket_count itself, so this list's length always matches
    // the number already shown. Needs no role lookup beyond the
    // Maintenance card already being present — same reasoning as
    // loadMaintenanceSnapshot above, and the same access gate
    // (requireMaintenanceHistoryAccess) protects both routes.
    // title_redacted tickets already arrive with a safe placeholder
    // string from the route (safeTicketTitle's own content-safety scan)
    // — rendered as plain text here, same as any other ticket title,
    // with no extra "(hidden)" wrapper of its own.
    // ────────────────────────────────────────────────────────────────
    // Renders one item inside a Related Work Orders note — either a
    // source: 'ticket' (a concurrent open ticket, real status shown so
    // Peter can tell historical vs. currently-happening) or a
    // source: 'snapshot_event' (an AppFolio bill-history record), per
    // related-work-orders-by-category-SPEC.md "What Gets Displayed."
    // Never blends the two shapes into one field — a snapshot_event has
    // no "status," a ticket has no "vendor."
    function renderRelatedItem(item) {
      if (item.source === 'ticket') {
        var meta = [];
        if (item.status) meta.push(escapeHtml(item.status));
        if (typeof item.cost === 'number') meta.push(formatMoney(item.cost));
        if (item.date) meta.push(formatDate(item.date));
        return '<div class="related-item">' +
          '<span class="related-item-title">' + escapeHtml(item.title) + '</span>' +
          '<span class="related-item-meta">' + meta.join(' &middot; ') + '</span>' +
          '</div>';
      }
      var snapMeta = [];
      if (item.vendor_name) snapMeta.push(escapeHtml(item.vendor_name));
      if (typeof item.amount === 'number') snapMeta.push(formatMoney(item.amount));
      if (item.date) snapMeta.push(formatDate(item.date));
      return '<div class="related-item">' +
        '<span class="related-item-title">' + escapeHtml(item.summary || '(no summary)') + '</span>' +
        '<span class="related-item-meta">' + snapMeta.join(' &middot; ') + '</span>' +
        '</div>';
    }

    // One calm, expandable note per matched category — never blended into
    // one mixed list, per the spec's own "If a ticket matches more than
    // one category" rule. Reuses the exact details.subsection/summary
    // pattern (see .related-note CSS above for the blue restyle).
    function renderRelatedWorkOrdersNotes(relatedWorkOrders) {
      if (!relatedWorkOrders || !relatedWorkOrders.length) return '';
      return relatedWorkOrders.map(function (group) {
        var moreCount = group.count - group.items.length;
        var label = group.count + ' past ' + escapeHtml(group.category_label) +
          (group.count === 1 ? ' issue' : ' issues') +
          ' in the last 5 years — worth checking before dispatching a vendor';
        var itemsHtml = group.items.map(renderRelatedItem).join('');
        var moreHtml = moreCount > 0 ? '<div class="related-more">+' + moreCount + ' more in the last 5 years</div>' : '';
        return '<details class="subsection related-note">' +
          '<summary>' + label + '</summary>' +
          '<div class="subsection-body">' + itemsHtml + moreHtml + '</div>' +
          '</details>';
      }).join('');
    }

    function renderOpenTicketsList(tickets) {
      if (!tickets.length) return '<div class="empty">No open tickets.</div>';
      var html = '<div class="ticket-list">';
      tickets.forEach(function (t) {
        html += '<div class="ticket-row">' +
          '<div class="ticket-row-main">' +
            '<span class="ticket-title">' + escapeHtml(t.title) + '</span>' +
            '<span class="ticket-meta">' +
              '<span>' + (t.status ? escapeHtml(t.status) : '&#8212;') + '</span>' +
              '<span>' + (typeof t.cost === 'number' ? formatMoney(t.cost) : '&#8212;') + '</span>' +
              '<span>' + (t.last_activity ? formatDate(t.last_activity) : '&#8212;') + '</span>' +
            '</span>' +
          '</div>' +
          renderRelatedWorkOrdersNotes(t.related_work_orders) +
          '</div>';
      });
      html += '</div>';
      return html;
    }

    async function loadOpenTickets(propertyId, bodyEl) {
      bodyEl.innerHTML = '<div class="empty">Loading&hellip;</div>';
      try {
        const res = await fetch('/api/maintenance-history/property/' + encodeURIComponent(propertyId) + '/open-tickets', { credentials: 'include' });
        const data = await res.json();
        if (!res.ok) {
          bodyEl.innerHTML = '<div class="empty">Couldn\'t load open tickets right now.</div>';
          return;
        }
        bodyEl.innerHTML = renderOpenTicketsList(data.open_tickets || []);
      } catch (e) {
        bodyEl.innerHTML = '<div class="empty">Couldn\'t load open tickets right now.</div>';
      }
    }

    function wireMaintenanceSection(propertyId, data) {
      if (!document.getElementById('maintenance-section')) return; // no Maintenance section rendered — nothing to wire

      // Open tickets toggle — collapsed by default (native <details>),
      // lazy-loaded the first time it's actually opened, same discipline
      // as the two subsections below.
      const openTicketsDetails = document.getElementById('open-tickets-details');
      if (openTicketsDetails) {
        let openTicketsLoaded = false;
        openTicketsDetails.addEventListener('toggle', function () {
          if (openTicketsDetails.open && !openTicketsLoaded) {
            openTicketsLoaded = true;
            loadOpenTickets(propertyId, document.getElementById('open-tickets-body'));
          }
        });
      }

      // Multi-year maintenance snapshot — needs no role lookup beyond the
      // Maintenance card already being present (see loadMaintenanceSnapshot's
      // own comment above for why this differs from Privacy Review below).
      // Collapsed by default; the real fetch only happens the first time
      // it's actually opened.
      const snapshotDetails = document.getElementById('snapshot-details');
      if (snapshotDetails) {
        let snapshotLoaded = false;
        snapshotDetails.addEventListener('toggle', function () {
          if (snapshotDetails.open && !snapshotLoaded) {
            snapshotLoaded = true;
            loadMaintenanceSnapshot(propertyId, document.getElementById('snapshot-body'));
          }
        });
      }

      // Privacy Review + the admin Users section both need the viewer's
      // real Maintenance History role (see loadPrivacyReview's own
      // comment for why this can't be inferred from the summary
      // response alone). One shared, already-gated, side-effect-free
      // lookup serves both — myEmail from the same call also feeds the
      // Users table's "(you)" marker.
      fetch('/api/maintenance-history/auth/me', { credentials: 'include' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (me) {
          if (!me) return;
          if (PRIVACY_REVIEW_ROLES.indexOf(me.role) !== -1) {
            const section = document.getElementById('maintenance-section');
            if (section) {
              const details = document.createElement('details');
              details.className = 'subsection';
              details.id = 'privacy-review-details';
              details.innerHTML = '<summary>Needs Privacy Review</summary><div class="subsection-body" id="privacy-review-body"></div>';
              section.appendChild(details);
              // Portfolio-wide entry point, next to (not inside) the
              // collapsed per-property subsection above so it's visible
              // without expanding anything — Peter, 2026-09-03: going
              // property-by-property for 290+ flagged items across ~390
              // properties was too slow. Plain same-tab navigation to
              // maintenance-history/router.js's GET /privacy-review, which
              // opens straight on the grouped, portfolio-wide "Needs
              // privacy review" queue instead of this one property's
              // items. Access is unchanged by this link — that page's own
              // API calls still enforce PRIVACY_REVIEW_ROLES +
              // director_of_operations' acknowledgment gate, same as the
              // per-property view above.
              const allPropertiesLink = document.createElement('div');
              allPropertiesLink.className = 'fact';
              allPropertiesLink.style.marginTop = '8px';
              allPropertiesLink.innerHTML = '<a class="prop-link" href="/privacy-review">Review all flagged items across every property &rarr;</a>';
              section.appendChild(allPropertiesLink);
              let privacyLoaded = false;
              details.addEventListener('toggle', function () {
                if (details.open && !privacyLoaded) { privacyLoaded = true; loadPrivacyReview(propertyId, document.getElementById('privacy-review-body'), false); }
              });
              const jumpLink = document.getElementById('jump-privacy-review');
              if (jumpLink) {
                jumpLink.addEventListener('click', function (e) {
                  e.preventDefault();
                  details.open = true;
                  details.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
              }
            }
          }
          if (data.maintenance_admin) {
            const adminSection = document.getElementById('admin-section');
            if (adminSection) loadUsers(document.getElementById('users-body'), me.email);
          }
        })
        .catch(function () { /* role lookup failed — Privacy Review/Users sections just don't appear; the rest of the page still works */ });
    }

    // ────────────────────────────────────────────────────────────────
    // Owner & Tenant Operational Notes — owner-tenant-operational-notes-
    // SPEC.md Section 9's UI item: "a labeled, collapsible section on the
    // property page (same interaction pattern as 'Needs Privacy Review'
    // and the Maintenance Snapshot section — click to open, never
    // force-displayed)." Reuses this page's own existing visual language
    // (.card/.section-title, details.subsection/summary, .claim/.btn/
    // .badge-*, .ack-gate-*/.form-hint from the Privacy Review UI above)
    // rather than inventing new UI language, per the build task's own
    // instruction.
    // ────────────────────────────────────────────────────────────────
    const NOTE_TIER_LABELS = {
      operational: 'Operational',
      management_compliance_restricted: 'Management/Compliance-Restricted',
      legal_privileged: 'Legal/Privileged',
    };
    const NOTE_TIER_BADGE_CLASS = {
      operational: 'badge-blue',
      management_compliance_restricted: 'badge-amber',
      legal_privileged: 'badge-red',
    };
    const NOTE_SUBJECT_LABELS = { owner: 'Owner', tenant: 'Tenant', property: 'Property (general)' };

    function ownerTenantNotesSectionHtml(card) {
      if (!card) return ''; // no access at all — no section, no hint it exists
      return '<div class="card" id="owner-tenant-notes-section">' +
        '<div class="section-title">Owner &amp; Tenant Operational Notes</div>' +
        '<p class="sub" style="margin:0 0 4px;">Factual notes about this property, its owner, or a tenant, for staff context. ' +
        'Never used to make or influence a leasing, screening, renewal, or eviction decision.</p>' +
        '<details class="subsection" id="own-notes-details">' +
        '<summary>View &amp; Add Notes</summary>' +
        '<div class="subsection-body" id="own-notes-body"></div>' +
        '</details>' +
        '</div>';
    }

    function renderNoteTierOptions(canAuthorLegalPrivileged, selected) {
      var opts = [
        ['operational', NOTE_TIER_LABELS.operational],
        ['management_compliance_restricted', NOTE_TIER_LABELS.management_compliance_restricted],
      ];
      if (canAuthorLegalPrivileged) opts.push(['legal_privileged', NOTE_TIER_LABELS.legal_privileged]);
      return opts.map(function (o) {
        return '<option value="' + o[0] + '"' + (o[0] === selected ? ' selected' : '') + '>' + o[1] + '</option>';
      }).join('');
    }

    function noteFormHtml(me) {
      return '<form class="note-form" id="own-note-form">' +
        '<div class="note-form-row">' +
        '<select name="subject_type" id="own-note-subject-type">' +
        '<option value="property">' + NOTE_SUBJECT_LABELS.property + '</option>' +
        '<option value="owner">' + NOTE_SUBJECT_LABELS.owner + '</option>' +
        '<option value="tenant"' + (me.role === 'maintenance_coordinator' ? ' disabled' : '') + '>' + NOTE_SUBJECT_LABELS.tenant + '</option>' +
        '</select>' +
        '<input type="text" name="subject_id" placeholder="Owner or tenant ID (optional, if known)">' +
        '</div>' +
        '<div class="note-form-row">' +
        '<input type="text" name="category" placeholder="Category (optional) — e.g. maintenance_standard, dispute">' +
        '<select name="access_tier">' + renderNoteTierOptions(me.can_author_legal_privileged, 'operational') + '</select>' +
        '</div>' +
        '<textarea name="note_text" placeholder="State the fact objectively — what was said or observed, not a characterization. Example: &quot;Owner asked that vendors call before entering the unit.&quot;" required></textarea>' +
        (me.role === 'maintenance_coordinator' ? '<div class="form-hint">Your role can only add notes about the owner or the property in general, not about a specific tenant.</div>' : '') +
        '<div><button type="submit" class="btn-primary">Save Note</button></div>' +
        '<div id="own-note-form-message"></div>' +
        '</form>';
    }

    function renderNoteItem(note, me) {
      if (note.pending_review) {
        return '<div class="claim">' +
          '<div class="claim-text note-pending">' + escapeHtml(note.note_text) + '</div>' +
          '<div class="claim-meta">' +
          '<span class="badge ' + (NOTE_TIER_BADGE_CLASS[note.access_tier] || 'badge-gray') + '">' + (NOTE_TIER_LABELS[note.access_tier] || note.access_tier) + '</span>' +
          '<span>' + formatDate(note.created_at) + '</span>' +
          '</div></div>';
      }
      var subjectLine = NOTE_SUBJECT_LABELS[note.subject_type] || note.subject_type;
      if (note.subject_name) subjectLine += ': ' + escapeHtml(note.subject_name);
      return '<div class="claim">' +
        '<div class="claim-text">' + escapeHtml(note.note_text) + '</div>' +
        '<div class="claim-meta">' +
        '<span class="badge ' + (NOTE_TIER_BADGE_CLASS[note.access_tier] || 'badge-gray') + '">' + (NOTE_TIER_LABELS[note.access_tier] || note.access_tier) + '</span>' +
        '<span>' + subjectLine + '</span>' +
        (note.category ? '<span class="claim-source">' + escapeHtml(note.category) + '</span>' : '') +
        '<span>' + formatDate(note.created_at) + '</span>' +
        (note.flagged_protected_class ? '<span class="badge badge-amber">Under compliance review history</span>' : '') +
        '</div></div>';
    }

    function ownTierAckGateHtml(message) {
      return '<div class="claim">' +
        '<div class="ack-gate-title">One-time notice — sensitive content</div>' +
        '<div class="ack-gate-body">' + escapeHtml(message) + '</div>' +
        '<button class="btn-primary" id="own-tier-ack-btn">I Acknowledge</button>' +
        '</div>';
    }

    // Lazy-loaded the first time the section is opened. Re-called after a
    // successful save, acknowledgment, or review action, so the list
    // always reflects the server's current view of this viewer's access —
    // never assembled client-side from a prior response.
    async function loadOwnerTenantNotes(propertyId, bodyEl, me) {
      bodyEl.innerHTML = '<div class="empty">Loading&hellip;</div>';
      let res, body;
      try {
        res = await fetch('/api/owner-tenant-notes/property/' + encodeURIComponent(propertyId), { credentials: 'include' });
        body = await res.json();
      } catch (e) {
        bodyEl.innerHTML = '<div class="empty">Couldn\'t load notes right now.</div>';
        return;
      }
      if (res.status === 403 && body && body.error === 'tier_access_acknowledgment_required') {
        bodyEl.innerHTML = ownTierAckGateHtml(body.message || 'Please acknowledge the access-use notice to continue.');
        document.getElementById('own-tier-ack-btn').addEventListener('click', async function () {
          try {
            const ackRes = await fetch('/api/owner-tenant-notes/tier-access/acknowledge', { method: 'POST', credentials: 'include' });
            if (!ackRes.ok) { showToast('Could not save acknowledgment.'); return; }
            loadOwnerTenantNotes(propertyId, bodyEl, me);
          } catch (e) { showToast('Network error.'); }
        });
        return;
      }
      if (!res.ok) {
        bodyEl.innerHTML = '<div class="empty">' + escapeHtml((body && body.error) || 'Couldn\'t load notes right now.') + '</div>';
        return;
      }

      const notes = body.notes || [];
      let html = noteFormHtml(me);
      html += notes.length
        ? notes.map(function (n) { return renderNoteItem(n, me); }).join('')
        : '<div class="empty">No notes on file for this property yet.</div>';
      // Reviewer-tier roles get a nested "Needs Compliance Review"
      // subsection, same collapsed-by-default/lazy-load discipline as
      // every other subsection on this page. Not shown at all to a role
      // that can't review (me.review_role false) — no hint it exists.
      if (me.review_role) {
        html += '<details class="subsection" id="own-notes-review-details">' +
          '<summary>Needs Compliance Review</summary>' +
          '<div class="subsection-body" id="own-notes-review-body"></div>' +
          '</details>';
      }
      bodyEl.innerHTML = html;

      document.getElementById('own-note-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const form = e.target;
        const msgEl = document.getElementById('own-note-form-message');
        msgEl.innerHTML = '';
        const payload = {
          property_id: propertyId,
          subject_type: form.subject_type.value,
          subject_id: form.subject_id.value.trim() || null,
          category: form.category.value.trim() || null,
          access_tier: form.access_tier.value,
          note_text: form.note_text.value,
        };
        const submitBtn = form.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        try {
          const saveRes = await fetch('/api/owner-tenant-notes', {
            method: 'POST', credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const saveBody = await saveRes.json();
          if (!saveRes.ok) {
            msgEl.innerHTML = '<div class="empty" style="padding:4px 0;color:#991b1b;">' + escapeHtml(saveBody.error || 'Could not save this note.') + '</div>';
            submitBtn.disabled = false;
            return;
          }
          showToast('Note saved.');
          if (saveBody.warnings && saveBody.warnings.derogatory_language) {
            msgEl.innerHTML = '<div class="note-warning">' + escapeHtml(saveBody.warnings.message) + '</div>';
          }
          loadOwnerTenantNotes(propertyId, bodyEl, me);
        } catch (err) {
          msgEl.innerHTML = '<div class="empty" style="padding:4px 0;color:#991b1b;">Network error — note was not saved.</div>';
          submitBtn.disabled = false;
        }
      });

      const reviewDetails = document.getElementById('own-notes-review-details');
      if (reviewDetails) {
        let reviewLoaded = false;
        reviewDetails.addEventListener('toggle', function () {
          if (reviewDetails.open && !reviewLoaded) {
            reviewLoaded = true;
            loadOwnerTenantNotesReviewQueue(propertyId, document.getElementById('own-notes-review-body'), bodyEl, me);
          }
        });
      }
    }

    // Reviewer-facing flagged queue — real content (never a placeholder),
    // per-property, one item at a time (spec Section 5's own "fast-follow,
    // not required for v1" on grouped/bulk review). Three disposition
    // buttons per counsel's exact three-outcome model (spec Section 5's
    // table) — deliberately not the confirm/correct/reject vocabulary
    // Maintenance History's own claim review uses.
    function renderReviewItem(item) {
      var subjectLine = NOTE_SUBJECT_LABELS[item.subject_type] || item.subject_type;
      if (item.subject_name) subjectLine += ': ' + escapeHtml(item.subject_name);
      return '<div class="claim" data-note-id="' + item.id + '">' +
        '<div class="claim-text">' + escapeHtml(item.note_text) + '</div>' +
        '<div class="claim-meta">' +
        '<span class="badge ' + (NOTE_TIER_BADGE_CLASS[item.access_tier] || 'badge-gray') + '">' + (NOTE_TIER_LABELS[item.access_tier] || item.access_tier) + '</span>' +
        '<span>' + subjectLine + '</span>' +
        (item.category ? '<span class="claim-source">' + escapeHtml(item.category) + '</span>' : '') +
        '<span>' + formatDate(item.created_at) + '</span>' +
        '</div>' +
        '<div class="claim-actions">' +
        '<button class="btn btn-confirm" data-action="retained_restricted">Retain Restricted</button>' +
        '<button class="btn btn-correct" data-action="rephrased_and_released">Rephrase &amp; Release</button>' +
        '<button class="btn btn-reject" data-action="false_positive_released">False Positive — Release</button>' +
        '</div>' +
        '<div class="correct-form" id="rephrase-form-' + item.id + '">' +
        '<textarea placeholder="Rewrite in operationally-appropriate language" required></textarea>' +
        '<select><option value="operational">Downgrade to Operational</option><option value="management_compliance_restricted">Keep at Management/Compliance-Restricted</option></select>' +
        '<button class="btn-primary" data-submit-rephrase="' + item.id + '">Submit</button>' +
        '</div>' +
        '</div>';
    }

    async function submitNoteReview(id, action, extra, statusEl) {
      try {
        const res = await fetch('/api/owner-tenant-notes/' + encodeURIComponent(id) + '/review', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(Object.assign({ action: action }, extra || {})),
        });
        const body = await res.json();
        if (!res.ok) { showToast(body.error || 'Could not save this review.'); return false; }
        showToast('Review saved.');
        return true;
      } catch (e) {
        showToast('Network error.');
        return false;
      }
    }

    async function loadOwnerTenantNotesReviewQueue(propertyId, bodyEl, notesBodyEl, me) {
      bodyEl.innerHTML = '<div class="empty">Loading&hellip;</div>';
      let res, body;
      try {
        res = await fetch('/api/owner-tenant-notes/property/' + encodeURIComponent(propertyId) + '/flagged-queue', { credentials: 'include' });
        body = await res.json();
      } catch (e) {
        bodyEl.innerHTML = '<div class="empty">Couldn\'t load the review queue right now.</div>';
        return;
      }
      if (res.status === 403 && body && body.error === 'tier_access_acknowledgment_required') {
        bodyEl.innerHTML = ownTierAckGateHtml(body.message || 'Please acknowledge the access-use notice to continue.');
        document.getElementById('own-tier-ack-btn').addEventListener('click', async function () {
          try {
            const ackRes = await fetch('/api/owner-tenant-notes/tier-access/acknowledge', { method: 'POST', credentials: 'include' });
            if (!ackRes.ok) { showToast('Could not save acknowledgment.'); return; }
            loadOwnerTenantNotesReviewQueue(propertyId, bodyEl, notesBodyEl, me);
          } catch (e) { showToast('Network error.'); }
        });
        return;
      }
      if (!res.ok) {
        bodyEl.innerHTML = '<div class="empty">' + escapeHtml((body && body.error) || 'Couldn\'t load the review queue right now.') + '</div>';
        return;
      }
      const items = body.items || [];
      if (!items.length) { bodyEl.innerHTML = '<div class="empty">Nothing needs review on this property right now.</div>'; return; }
      bodyEl.innerHTML = items.map(renderReviewItem).join('');

      bodyEl.querySelectorAll('.claim[data-note-id]').forEach(function (claimEl) {
        const id = claimEl.getAttribute('data-note-id');
        claimEl.querySelectorAll('.claim-actions button').forEach(function (btn) {
          btn.addEventListener('click', async function () {
            const action = btn.getAttribute('data-action');
            if (action === 'rephrased_and_released') {
              document.getElementById('rephrase-form-' + id).classList.add('visible');
              return;
            }
            btn.disabled = true;
            const ok = await submitNoteReview(id, action, {});
            if (ok) loadOwnerTenantNotesReviewQueue(propertyId, bodyEl, notesBodyEl, me);
            else btn.disabled = false;
          });
        });
        const rephraseForm = document.getElementById('rephrase-form-' + id);
        const submitBtn = rephraseForm.querySelector('[data-submit-rephrase]');
        submitBtn.addEventListener('click', async function () {
          const textarea = rephraseForm.querySelector('textarea');
          const select = rephraseForm.querySelector('select');
          if (!textarea.value.trim()) { showToast('Enter the rephrased text first.'); return; }
          submitBtn.disabled = true;
          const ok = await submitNoteReview(id, 'rephrased_and_released', { note_text: textarea.value.trim(), access_tier: select.value });
          if (ok) loadOwnerTenantNotesReviewQueue(propertyId, bodyEl, notesBodyEl, me);
          else submitBtn.disabled = false;
        });
      });
    }

    function wireOwnerTenantNotesSection(propertyId, data) {
      const section = document.getElementById('owner-tenant-notes-section');
      if (!section) return; // no access at all — nothing to wire

      fetch('/api/owner-tenant-notes/auth/me', { credentials: 'include' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (me) {
          if (!me) return;
          const details = document.getElementById('own-notes-details');
          const bodyEl = document.getElementById('own-notes-body');
          let loaded = false;
          details.addEventListener('toggle', function () {
            if (details.open && !loaded) { loaded = true; loadOwnerTenantNotes(propertyId, bodyEl, me); }
          });
        })
        .catch(function () { /* role lookup failed — section stays present but won't load; rest of the page still works */ });
    }

    // ────────────────────────────────────────────────────────────────
    // Whole-property page assembly
    // ────────────────────────────────────────────────────────────────
    function renderProperty(data, propertyId) {
      const cardKeys = data.card_order || [];
      const cardsHtml = cardKeys
        .map(function (key) {
          const renderer = CARD_RENDERERS[key];
          return renderer ? renderer(data.cards[key], data.property) : '';
        })
        .filter(Boolean)
        .join('');

      const anyCards = Object.keys(data.cards || {}).length > 0;

      document.getElementById('app').innerHTML =
        renderHeader(data) +
        renderAttentionBanner(data.needs_attention) +
        // Complaint Tracking's Issues section — placed here, right after
        // the header/attention banner and before the card-grid, so a
        // big-deal complaint is the first real content a viewer with
        // access sees (product doc: "visible the moment the page
        // loads"). An empty, id-only mount point — real markup (or
        // nothing at all, for a viewer without access) is filled in by
        // loadComplaintTrackingSection below, after its own /auth/me
        // check, the same "check first, mount on success only" order
        // wireOwnerTenantNotesSection uses for its own section further
        // down this page.
        '<div id="complaint-tracking-mount"></div>' +
        (cardsHtml ? '<div class="card-grid">' + cardsHtml + '</div>' : '') +
        // Owner & Tenant Operational Notes placed right after the card-grid
        // (Insurance/Security Deposit/LeadSimple) and before Maintenance,
        // per Peter's explicit placement request (2026-09-05) — moved up
        // from its original position after Maintenance.
        ownerTenantNotesSectionHtml(data.cards.owner_tenant_notes) +
        maintenanceSectionHtml(data.cards.maintenance) +
        // Archive Search — placed directly under Maintenance (which ends
        // in Maintenance Notes), alongside the Complaint Tracking/Issues
        // section mounted above, not replacing it. See
        // archiveSearchSectionHtml's own comment for the full access-
        // control story.
        archiveSearchSectionHtml(data.archive_search_access) +
        (data.maintenance_admin ? '<div class="card" id="admin-section"><div class="section-title">Maintenance History — Users (admin only)</div><div id="users-body"></div></div>' : '') +
        (!anyCards ? '<div class="empty">Nothing on file for this property in any tool you have access to yet.</div>' : '') +
        '<div class="callstats-note">Call Stats tracks staff phone activity by pod, not by property, so it isn\'t part of this page.</div>';

      wireMaintenanceSection(propertyId, data);
      wireOwnerTenantNotesSection(propertyId, data);
      wireArchiveSearchSection();
      loadComplaintTrackingSection(propertyId, document.getElementById('complaint-tracking-mount'));
      pushRecent(data.property);
    }

    function renderError(message) {
      document.getElementById('app').innerHTML =
        '<div class="error-page">' + escapeHtml(message) + '<div style="margin-top:16px;"><a class="prop-link" href="/property-360">&larr; Back to search</a></div></div>';
    }

    // ────────────────────────────────────────────────────────────────
    // Entry point
    // ────────────────────────────────────────────────────────────────
    async function init() {
      const propertyId = qs('property_id');
      if (!propertyId) { renderLanding(); return; }
      try {
        const res = await fetch('/api/property-360/' + encodeURIComponent(propertyId) + '/summary', { credentials: 'include' });
        const body = await res.json();
        if (!res.ok) {
          renderError(res.status === 404 ? 'That property could not be found.' : (body && body.error) || 'Something went wrong loading this property.');
          return;
        }
        renderProperty(body, propertyId);
      } catch (e) {
        renderError('Something went wrong loading this property.');
      }
    }

    init();
  </script>
</body>
</html>
