<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property 360 — Rincon Management</title>
  <style>
    /* ============================================================
       House style, copied from the real thing — NOT the "stone"
       palette lib/global-search-widget.js's own comment claims every
       dashboard matches. Checked live: insurance/dashboard/index.html,
       security-deposit/dashboard/index.html, and
       maintenance-history/dashboard/index.html all actually share one
       consistent palette (gray/blue, Tailwind-ish: #f9fafb bg,
       #111827 text, #6b7280 muted, #e5e7eb/#d1d5db borders, #1d4ed8
       accent) — that stone comment only describes server.js's own
       page() shell (login/home) and the search-bar widget itself, not
       any tool's actual dashboard body. Property 360 is folding three
       of those tools' own content onto one page, so it matches THEM,
       not the shell comment. Every class name/color/badge/button
       convention below is reused verbatim from those three files
       (confirmed by reading each), not invented fresh — see e.g.
       insurance/dashboard/index.html's statusBadge()/.badge-* block,
       security-deposit/dashboard/index.html's daysInfo()/tenancy
       badges, and maintenance-history/dashboard/index.html's
       claim/correct-form/toast/budget/users patterns. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      background: #f9fafb;
      color: #111827;
      min-height: 100vh;
    }
    .page { max-width: 1000px; margin: 0 auto; padding: 24px 16px 48px; }
    a.back { font-size: 13px; color: #374151; text-decoration: none; }
    a.back:hover { text-decoration: underline; }
    h1 { font-size: 22px; font-weight: 700; margin: 8px 0 4px; }
    p.sub { color: #6b7280; margin-bottom: 20px; font-size: 13px; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 18px; margin-bottom: 16px; }
    .empty { color: #9ca3af; padding: 24px; text-align: center; }
    .section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: #374151; margin: 0 0 10px; }
    .prop-link { color: #1d4ed8; cursor: pointer; text-decoration: none; }
    .prop-link:hover { text-decoration: underline; }

    /* ── Toast (save confirmation) — maintenance-history/dashboard's
       own pattern, verbatim ── */
    .toast {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(8px);
      background: #111827; color: #fff; font-size: 13px; font-weight: 500;
      padding: 10px 18px; border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,0.18);
      opacity: 0; pointer-events: none; transition: opacity 0.15s ease, transform 0.15s ease;
      z-index: 1000;
    }
    .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Landing (no property picked) ─────────────────────────────── */
    .landing-hint { text-align: center; padding: 32px 8px 8px; color: #6b7280; font-size: 13.5px; }
    .recent-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #9ca3af; margin: 24px 0 8px; }
    .recent-item { display: block; padding: 10px 14px; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; text-decoration: none; color: #111827; margin-bottom: 8px; }
    .recent-item:hover { border-color: #d1d5db; background: #f9fafb; }
    .recent-item strong { display: block; font-size: 13.5px; }
    .recent-item span { display: block; font-size: 12px; color: #6b7280; margin-top: 2px; }

    /* ── Property header — the same shape as Maintenance History's own
       Property Overview tab header (ov-header-row/ov-header-title/
       ov-spend-row), reused directly since a property "profile" header
       is exactly what that tab already renders. ─────────────────── */
    .ov-header-row { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
    .ov-header-title { font-size: 18px; font-weight: 700; }
    .ov-header-sub { color: #6b7280; font-size: 12.5px; margin-top: 2px; }
    .ov-owner-note { color: #6b7280; font-size: 12.5px; margin-top: 8px; }
    .ov-spend-row { display: flex; gap: 28px; margin-top: 14px; flex-wrap: wrap; }
    .ov-spend-figure { font-size: 16px; font-weight: 700; }
    .ov-spend-label { color: #6b7280; font-size: 11.5px; }

    /* ── Needs-attention banner ────────────────────────────────────── */
    .attention-banner { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px; line-height: 1.5; }

    /* ── Complaint Tracking — Issues section (Tron's addition). Big-deal
       items only, flat, no toggle at all (product doc: "shows only its
       big-deal complaints, flat and visible the moment the page loads —
       no toggle, no click-through" — unlike every other collapsible
       section on this page, this one is never a <details>). Built
       entirely client-side (see loadComplaintTrackingSection below) —
       property-360/router.js is untouched: this section calls complaint-
       tracking/router.js's own already-built, already-gated routes
       directly, the same way the Owner & Tenant Notes section above
       calls owner-tenant-notes/router.js's routes directly rather than
       going through this page's own aggregate /summary endpoint. Same
       category/subject-type color vocabulary as complaint-tracking/
       dashboard/index.html's own, kept consistent across the Hub. ── */
    .ct-section { margin-bottom: 16px; }
    .ct-card { border: 1px solid #e5e7eb; border-left: 4px solid #d1d5db; border-radius: 8px; padding: 11px 13px; margin-bottom: 8px; }
    .ct-card.subj-owner       { border-left-color: #7c3aed; }
    .ct-card.subj-tenant       { border-left-color: #0284c7; }
    .ct-card.subj-team_member  { border-left-color: #0d9488; }
    .ct-card.subj-property, .ct-card.subj-unmatched { border-left-color: #6b7280; }
    .ct-card.is-held { border-left-color: #111827; background: #fafafa; }
    .ct-top { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
    .ct-badges { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
    .ct-date { font-size: 11px; color: #9ca3af; white-space: nowrap; }
    .ct-desc { font-size: 12.5px; color: #111827; line-height: 1.4; margin-bottom: 4px; }
    .ct-desc.empty { color: #9ca3af; font-style: italic; }
    .ct-held-box { background: #111827; color: #f9fafb; border-radius: 6px; padding: 5px 9px; font-size: 10.5px; font-weight: 700; margin-bottom: 6px; display: inline-block; letter-spacing: 0.01em; }
    .ct-held-box.closed { background: #f3f4f6; color: #374151; }
    .ct-cat { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 10.5px; font-weight: 600; white-space: nowrap; }
    .ct-cat-legal_compliance          { background: #f5f3ff; color: #6d28d9; border: 1px solid #ddd6fe; }
    .ct-cat-blocked_resolution        { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .ct-cat-churn_risk                { background: #fff7ed; color: #9a3412; border: 1px solid #fed7aa; }
    .ct-cat-escalation_recurrence     { background: #fdf2f8; color: #9d174d; border: 1px solid #fbcfe8; }
    .ct-cat-major_money_property_risk { background: #fef2f2; color: #7f1d1d; border: 1px solid #fca5a5; font-weight: 700; }
    .ct-cat-owner_instruction_one_off { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
    .ct-status { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 10.5px; font-weight: 700; color: #fff; }
    .ct-status-open        { background: #1d4ed8; }
    .ct-status-in_progress { background: #d97706; }
    .ct-status-blocked     { background: #dc2626; }
    .ct-status-resolved    { background: #16a34a; }
    .ct-status-held        { background: #374151; }
    .ct-subj { font-weight: 700; }
    .ct-link { font-size: 11.5px; color: #1d4ed8; text-decoration: none; }
    .ct-link:hover { text-decoration: underline; }
    .ct-group-heading { font-size: 11px; font-weight: 700; color: #374151; text-transform: uppercase; letter-spacing: 0.03em; margin: 10px 0 6px; display: flex; align-items: center; gap: 6px; }
    .ct-group-heading .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .ct-group-heading.owner .dot  { background: #7c3aed; }
    .ct-group-heading.tenant .dot { background: #0284c7; }
    .ct-group-heading.other .dot  { background: #6b7280; }

    /* ── Insurance / Security Deposit / LeadSimple card grid ──────── */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .summary-card h3 { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: #374151; margin-bottom: 10px; }
    .fact { font-size: 13px; margin: 6px 0; color: #374151; }
    .fact .fl { color: #9ca3af; margin-right: 3px; }
    .sub-line { font-size: 12px; color: #9ca3af; margin-top: 8px; }
    .card-link { display: inline-block; margin-top: 10px; font-size: 12.5px; color: #1d4ed8; text-decoration: none; }
    .card-link:hover { text-decoration: underline; }

    /* ── Status badges — reused verbatim, same colors and labels as
       insurance/dashboard/index.html's statusBadge() and
       security-deposit/dashboard/index.html's statusBadge()/tenancy
       badges, because these are the exact same status values. ────── */
    .badge { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 11px; font-weight: 600; white-space: nowrap; letter-spacing: 0.02em; }
    .badge-compliant               { background: #16a34a; color: #fff; }
    .badge-expiring_soon           { background: #d97706; color: #fff; }
    .badge-expired                 { background: #dc2626; color: #fff; }
    .badge-pending_review          { background: #6b7280; color: #fff; }
    .badge-escalated               { background: #7c3aed; color: #fff; }
    .badge-no_policy               { background: #e5e7eb; color: #374151; }
    .badge-insufficient_liability  { background: #dc2626; color: #fff; font-weight: 700; }
    .badge-no_additional_insured   { background: #d97706; color: #fff; font-weight: 700; }
    .badge-reviewed                { background: #16a34a; color: #fff; }
    .badge-unknown                 { background: #e5e7eb; color: #6b7280; }
    .badge-full_tenancy_ending        { background: #e0f2fe; color: #075985; }
    .badge-partial_co_tenant_move_out { background: #ede9fe; color: #5b21b6; }
    .badge-tenancy-unconfirmed        { background: #fef3c7; color: #92400e; }
    .badge-gray  { background: #f3f4f6; color: #4b5563; }
    .badge-amber { background: #fffbeb; color: #92400e; }
    .badge-red   { background: #fef2f2; color: #991b1b; }
    .badge-green { background: #f0fdf4; color: #166534; }
    .badge-blue  { background: #eff6ff; color: #1d4ed8; }

    .days-green { color: #16a34a; font-weight: 600; }
    .days-amber { color: #d97706; font-weight: 600; }
    .days-red   { color: #dc2626; font-weight: 600; }
    .days-gray  { color: #9ca3af; font-weight: 600; }

    /* ── Maintenance "where the money went" pie chart — repair-type
       breakdown, colors assigned per category in maintenance-history/
       dashboard's shared MAINTENANCE_CATEGORY_COLORS map (validated via
       the dataviz skill's palette validator; see that map's own
       comment). Legend sits beside the chart on a normal-width card,
       stacks below it on mobile (same @media breakpoint every other
       responsive rule in this file already uses). ────────────────── */
    .pie-wrap { display: flex; gap: 16px; align-items: flex-start; margin-top: 12px; flex-wrap: wrap; }
    .pie-wrap svg { flex: none; }
    .pie-legend { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 5px; }
    .pie-legend-row { display: flex; align-items: baseline; gap: 6px; font-size: 12.5px; color: #374151; line-height: 1.4; }
    .pie-swatch { flex: none; width: 10px; height: 10px; border-radius: 2px; margin-top: 1px; }
    .pie-legend-cat { font-weight: 600; }
    .pie-legend-amt { color: #6b7280; white-space: nowrap; }

    /* Maintenance Notes — moved off the Maintenance card (2026-09-08,
       Peter's placement + styling escalation) into the property header,
       next to the owner contact box, since that's the area staff already
       look at first when pulling up a property. Still the exact same
       plain field/no-caveat-wording rule as before (see
       compliance/appfolio-maintenance-notes-decision-resolution.md) —
       this is a prominence change only, not new warning language. Red,
       bold, boxed so it reads as "important, look at this" the way a
       flagged line on a bank statement does, not styled like this page's
       own .attention-banner/error-state components (no icon, no
       "warning"/"caution" text). */
    .header-maintenance-notes { margin-top: 12px; padding: 10px 14px; background: #fef2f2; border: 1px solid #fecaca; border-left: 4px solid #dc2626; border-radius: 6px; text-align: left; }
    .header-maintenance-notes .fl { color: #dc2626; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; font-size: 11px; }
    .header-maintenance-notes-text { margin-top: 4px; white-space: pre-wrap; line-height: 1.4; font-weight: 700; font-size: 14.5px; color: #b91c1c; }

    /* ── Archive Search widget — compliance/archive-search-property-360-
       embed-owner-risk-acceptance.md (all three addenda),
       compliance/archive-search-property-360-embed-asimov-confirmation.md,
       compliance/archive-search-property-360-embed-mason-confirmation.md
       (both CLEARED WITH CONDITIONS). Placed directly under the
       Maintenance section (which itself ends with Maintenance Notes) —
       alongside, not replacing, the Complaint Tracking / Issues section
       above. Real markup only ever renders once property-360/router.js's
       own archive_search_access flag (a real searcher/admin role check,
       not a bypass) is true — same "no hint it exists otherwise"
       discipline as every other gated section on this page. Reuses this
       page's own .card/.section-title shell rather than inventing a new
       container style. ────────────────────────────────────────────── */
    .as-search-row { display: flex; gap: 8px; margin-bottom: 4px; }
    .as-search-row input[type="text"] {
      flex: 1; padding: 7px 10px; border: 1px solid #d1d5db; border-radius: 6px;
      font-size: 13.5px; font-family: inherit; color: #111827;
    }
    .as-search-row input[type="text"]:focus { outline: 2px solid #bfdbfe; border-color: #1d4ed8; }
    .as-hint { font-size: 11.5px; color: #9ca3af; margin: 4px 0 10px; }
    .as-results { margin-top: 8px; }
    .as-result { border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
    .as-result:hover { border-color: #d1d5db; background: #f9fafb; }
    .as-result-top { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .as-result-subject { font-weight: 700; font-size: 13.5px; color: #111827; }
    .as-result-date { font-size: 11px; color: #9ca3af; white-space: nowrap; }
    .as-result-from { font-size: 12px; color: #6b7280; margin-top: 2px; }
    .as-result-snippet { font-size: 12.5px; color: #374151; margin-top: 5px; line-height: 1.4; }
    .as-result-snippet mark { background: #fef08a; color: inherit; border-radius: 2px; }
    .as-message-body {
      border: 1px solid #e5e7eb; border-top: none; border-radius: 0 0 8px 8px;
      margin: -8px 0 8px; padding: 12px; background: #f9fafb;
      font-size: 12.5px; color: #111827; white-space: pre-wrap; line-height: 1.5;
    }
    .as-message-body a { color: #1d4ed8; }

    /* ── Maintenance section: summary + one collapsed-by-default
       subsection (Needs Privacy Review) ─────────────────── */
    details.subsection { border-top: 1px solid #f3f4f6; margin-top: 16px; padding-top: 14px; }
    details.subsection summary { cursor: pointer; font-size: 14px; font-weight: 700; list-style: none; display: flex; align-items: center; gap: 6px; color: #111827; }
    details.subsection summary::-webkit-details-marker { display: none; }
    details.subsection summary::before { content: '▸'; font-size: 11px; color: #9ca3af; display: inline-block; transition: transform 0.15s; }
    details.subsection[open] summary::before { transform: rotate(90deg); }
    .subsection-body { margin-top: 12px; }

    /* Open tickets toggle — the open_ticket_count stat itself, made
       clickable. Same details.subsection/summary pattern above, just
       sitting inline as one cell of .ov-spend-row instead of a full-width
       block below it, so it needs the top border/spacing zeroed out
       (its siblings in that row have none) while keeping the same arrow
       marker + rotate-on-open behavior. */
    .ov-spend-row details.subsection.ov-open-tickets { border-top: none; margin-top: 0; padding-top: 0; flex: 1 1 160px; }
    /* Made clearly clickable per Peter's feedback (2026-09-04) — the
       plain arrow-before-a-stat treatment every other collapsible
       subsection uses read as just another number next to "Spend,
       trailing 12mo" (which isn't clickable), not as a control. This
       one gets its own affordance: a bordered chip, a hover state, and
       the same link-blue .card-link already uses elsewhere on this page
       for "click to see more," so it reads as a button, not a stat. */
    .ov-spend-row details.subsection.ov-open-tickets summary { font-size: inherit; font-weight: inherit; gap: 6px; padding: 6px 10px; margin: -6px -10px; border: 1px solid #bfdbfe; border-radius: 8px; background: #eff6ff; transition: background 0.12s, border-color 0.12s; }
    .ov-spend-row details.subsection.ov-open-tickets summary:hover { background: #dbeafe; border-color: #93c5fd; }
    .ov-spend-row details.subsection.ov-open-tickets summary::before { content: '▸'; font-size: 15px; font-weight: 700; color: #1d4ed8; }
    .ov-spend-row details.subsection.ov-open-tickets .ov-spend-figure { color: #1d4ed8; }
    .ov-spend-row details.subsection.ov-open-tickets .ov-spend-label { color: #1d4ed8; }
    .ov-spend-row details.subsection.ov-open-tickets .subsection-body { min-width: 260px; }

    /* Open Tickets — list of rows, not a table (related-work-orders-by-
       category-SPEC.md: a <details> note can't nest cleanly inside a
       <td>). Same fields the old table showed (title, status, cost,
       last activity), each row optionally followed by one calm "Related
       Work Orders" note per matched category. */
    .ticket-list { display: flex; flex-direction: column; gap: 10px; }
    .ticket-row { border: 1px solid #e5e7eb; border-radius: 6px; padding: 10px 12px; }
    .ticket-row-main { display: flex; justify-content: space-between; align-items: baseline; gap: 8px 14px; flex-wrap: wrap; }
    .ticket-title { font-size: 13px; font-weight: 600; color: #111827; }
    .ticket-meta { display: flex; gap: 12px; font-size: 12px; color: #6b7280; white-space: nowrap; }

    /* Related Work Orders note — one per matched category, never blended
       into a mixed list. Same nested details.subsection/summary
       expand-in-place mechanics as every other collapsible bit on this
       page (arrow marker, rotate-on-open — inherited from the base
       details.subsection rules above), restyled here with the *exact*
       same calm blue #eff6ff/#bfdbfe/#1d4ed8 already used for
       .ov-open-tickets summary — deliberately not a new warning color.
       Peter asked twice for "not scary or obtrusive": reusing this
       page's own existing "here's more if you want it" visual language
       is the actual answer to that, not a new alarm-shaped component. */
    .ticket-row details.subsection.related-note { border-top: none; margin-top: 8px; padding-top: 0; }
    .ticket-row details.subsection.related-note + details.subsection.related-note { margin-top: 6px; }
    .ticket-row details.subsection.related-note summary { font-size: 12.5px; font-weight: 600; padding: 6px 10px; border: 1px solid #bfdbfe; border-radius: 6px; background: #eff6ff; color: #1d4ed8; transition: background 0.12s, border-color 0.12s; }
    .ticket-row details.subsection.related-note summary:hover { background: #dbeafe; border-color: #93c5fd; }
    .ticket-row details.subsection.related-note summary::before { color: #1d4ed8; }
    .related-item { padding: 6px 2px; border-bottom: 1px solid #f3f4f6; font-size: 12.5px; }
    .related-item:last-child { border-bottom: none; }
    .related-item-title { display: block; color: #111827; }
    .related-item-meta { display: block; color: #6b7280; font-size: 11.5px; margin-top: 2px; }
    .related-more { font-size: 11.5px; color: #6b7280; padding: 6px 2px 0; }

    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th { text-align: left; color: #6b7280; font-weight: 600; padding: 8px; border-bottom: 1px solid #e5e7eb; }
    td { padding: 8px; border-bottom: 1px solid #f3f4f6; vertical-align: top; }
    .table-scroll { overflow-x: auto; }

    /* Privacy Review claims — reused verbatim from maintenance-history/dashboard */
    .claim { border: 1px solid #e5e7eb; border-radius: 6px; padding: 12px 14px; margin-bottom: 8px; }
    .claim-text { font-size: 13.5px; color: #111827; margin-bottom: 6px; line-height: 1.4; }
    .claim-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 11.5px; color: #6b7280; margin-bottom: 8px; }
    .claim-source { font-style: italic; }
    .claim-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn { font-size: 12px; padding: 4px 10px; border-radius: 5px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; color: #374151; font-family: inherit; }
    .btn:hover { background: #f3f4f6; }
    .btn-confirm { border-color: #16a34a; color: #166534; }
    .btn-reject { border-color: #dc2626; color: #991b1b; }
    .btn-correct { border-color: #2563eb; color: #1d4ed8; }
    .btn-primary { background: #1d4ed8; border: none; border-radius: 6px; padding: 8px 18px; font-size: 13px; color: #fff; cursor: pointer; font-weight: 600; font-family: inherit; }
    .btn-primary:hover { background: #1e40af; }
    .btn-primary:disabled { background: #9ca3af; cursor: not-allowed; }
    .correct-form { margin-top: 8px; display: none; border-top: 1px dashed #e5e7eb; padding-top: 8px; }
    .correct-form.visible { display: block; }
    .correct-form textarea, .correct-form input { width: 100%; font-size: 12.5px; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 5px; margin-bottom: 6px; font-family: inherit; }
    .correct-form textarea { min-height: 50px; }
    .form-hint { color: #6b7280; font-size: 11.5px; margin-bottom: 8px; }
    .toggle-row { display: flex; align-items: center; gap: 6px; font-size: 12.5px; margin-bottom: 14px; color: #374151; }
    .ack-gate-title { font-weight: 700; font-size: 14px; margin-bottom: 8px; }
    .ack-gate-body { font-size: 13px; color: #374151; line-height: 1.5; margin-bottom: 12px; }

    /* Admin Users section — same table/form shape as
       maintenance-history/dashboard's own Users tab. */
    .grant-form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .grant-form input, .grant-form select { padding: 7px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; font-family: inherit; }
    .grant-form input { flex: 1; min-width: 200px; }
    .users-table select { font-size: 13px; padding: 4px 8px; border: 1px solid #d1d5db; border-radius: 4px; font-family: inherit; }

    .callstats-note { text-align: center; font-size: 12.5px; color: #9ca3af; margin-top: 24px; }
    .error-page { text-align: center; padding: 48px 16px; color: #6b7280; }

    /* ── Owner & Tenant Operational Notes — reuses .claim/.btn/.badge-*/
       .ack-gate-*/.form-hint from Maintenance History's own Privacy
       Review UI above (same visual language, not a new component
       vocabulary), plus one small stacked form variant (.note-form) since
       note_text needs a full-width textarea the way .grant-form's inline
       row layout doesn't fit. ─────────────────────────────────────────── */
    .note-form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; }
    .note-form textarea, .note-form input, .note-form select { font-size: 13px; padding: 7px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-family: inherit; }
    .note-form textarea { min-height: 60px; resize: vertical; }
    .note-form-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .note-form-row > * { flex: 1; min-width: 140px; }
    .note-pending { color: #6b7280; font-style: italic; }
    .note-warning { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; font-size: 12.5px; padding: 8px 10px; border-radius: 6px; margin-top: 8px; }

    /* ── Responsive — same convention insurance/dashboard and
       security-deposit/dashboard already use (@media max-width:600px),
       not a new pattern. ────────────────────────────────────────── */
    @media (max-width: 600px) {
      .page { padding: 16px 12px 40px; }
      h1 { font-size: 19px; }
      .card-grid { grid-template-columns: 1fr; }
      .ov-header-row { flex-direction: column; }
      .ov-header-row > div:last-child { text-align: left !important; }
      .ov-spend-row { gap: 18px; }
      .grant-form input { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="page">
    <a class="back" href="/">&larr; Rincon Hub</a>
    <h1>Property 360</h1>
    <p class="sub">Everything the Hub knows about one property — insurance, security deposit, maintenance, and leasing activity — in one place. You only ever see what you could already see by opening that tool directly.</p>
    <div id="app"><div class="empty">Loading&hellip;</div></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    // ────────────────────────────────────────────────────────────────
    // Shared helpers
    // ────────────────────────────────────────────────────────────────
    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function qs(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    function formatDate(d) {
      if (!d) return null;
      const dt = new Date(d + (String(d).length <= 10 ? 'T00:00:00' : ''));
      if (isNaN(dt.getTime())) return d;
      return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function formatDateTime(dateStr) {
      if (!dateStr) return '&#8212;';
      const d = new Date(dateStr);
      if (isNaN(d)) return '&#8212;';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ' at ' +
        d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    }

    // Whole-dollar formatting — matches insurance/dashboard's own
    // formatCurrency(), used for coverage amounts (big, round figures).
    function formatCurrency(n) {
      if (n == null) return '&#8212;';
      return '$' + Number(n).toLocaleString('en-US', { maximumFractionDigits: 0 });
    }

    // Cents-precision formatting — matches maintenance-history/dashboard's
    // own formatMoney(), used for ticket/budget spend figures.
    function formatMoney(n) {
      if (n == null || isNaN(n)) return '&#8212;';
      return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function propertyLabel(property) {
      return property.name || property.address || '';
    }

    let toastHideTimer = null;
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('visible');
      clearTimeout(toastHideTimer);
      toastHideTimer = setTimeout(function () { toast.classList.remove('visible'); }, 2500);
    }

    // ── Recently viewed — localStorage only, per-device, nothing new on
    // the server (property-360-SPEC.md's "What You'll See": "stored
    // only on your own device"). Capped at 8, most-recently-opened
    // first, deduped by property id. ──────────────────────────────────
    const RECENT_KEY = 'p360_recent_properties';
    const RECENT_MAX = 8;

    function getRecent() {
      try {
        const raw = window.localStorage.getItem(RECENT_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
      } catch (e) { return []; }
    }

    function pushRecent(p) {
      try {
        const arr = getRecent().filter(function (r) { return r.id !== p.id; });
        arr.unshift({ id: p.id, name: p.name, address: p.address, city: p.city });
        window.localStorage.setItem(RECENT_KEY, JSON.stringify(arr.slice(0, RECENT_MAX)));
      } catch (e) { /* storage unavailable — a per-viewer convenience, not core */ }
    }

    // ────────────────────────────────────────────────────────────────
    // Landing page — no property_id in the URL. The hub-wide search
    // widget (injected right above .page by property-360/router.js) is
    // the only way to pick a property; this just adds the
    // recently-viewed strip underneath the fixed page heading.
    // ────────────────────────────────────────────────────────────────
    function renderLanding() {
      const recent = getRecent();
      let html = '<div class="landing-hint">Search for a property above to get started.</div>';
      if (recent.length) {
        html += '<div class="recent-label">Recently viewed</div>';
        recent.forEach(function (p) {
          html += '<a class="recent-item" href="/property-360?property_id=' + encodeURIComponent(p.id) + '">' +
            '<strong>' + escapeHtml(p.name || p.address || 'Unknown property') + '</strong>' +
            (p.address ? '<span>' + escapeHtml(p.address) + (p.city ? ', ' + escapeHtml(p.city) : '') + '</span>' : '') +
            '</a>';
        });
      }
      html += '<div class="callstats-note">Call Stats tracks staff phone activity by pod, not by property, so it isn\'t part of this page.</div>';
      document.getElementById('app').innerHTML = html;
    }

    // ────────────────────────────────────────────────────────────────
    // Maintenance Notes — plain mirror of AppFolio's own property-level
    // maintenance-notes field (supabase/migrations/20260906000000_
    // add_maintenance_notes_to_properties.sql). Read from
    // data.cards.maintenance.data.maintenance_notes — the exact same
    // value/data path getMaintenanceHistoryPropertySummary
    // (maintenance-history/router.js) already puts on the Maintenance
    // card; only WHERE this renders moved (2026-09-08, Peter's placement
    // + styling escalation), not what data feeds it or how it's escaped.
    // Only present in `data.cards` at all for a viewer with real
    // Maintenance History access, and fetchMaintenanceCard
    // (property-360/router.js) keeps status: 'ok' whenever a real note
    // exists even with no ticket/spend data — so this same guard
    // (status === 'ok') is sufficient, no separate access check needed
    // here. Deliberately just a label and the raw text — no "unscreened,"
    // no "verify before relying on this," no caveat of any kind (Peter's
    // explicit, non-negotiable styling call, unchanged by this move) —
    // only the visual treatment escalated to red/bold/prominent. Omitted
    // entirely when null/empty, same as before.
    // ────────────────────────────────────────────────────────────────
    function renderHeaderMaintenanceNotes(notes) {
      if (!notes) return ''; // null/empty — omit entirely, no empty box, no "no notes" placeholder
      return '<div class="header-maintenance-notes"><span class="fl">Maintenance Notes:</span>' +
        '<div class="header-maintenance-notes-text">' + escapeHtml(notes) + '</div></div>';
    }

    // ────────────────────────────────────────────────────────────────
    // Header — property-360-SPEC.md "What You'll See": name/address/
    // city, real occupancy + nearest upcoming lease-end, owner name/
    // phone/email. Same visual shape as Maintenance History's own
    // Property Overview tab header (that file's ov-header-row /
    // ov-spend-row), reused directly rather than invented fresh.
    // Maintenance Notes (when present) renders here too, right beside
    // the owner contact box — this is the area staff already look at
    // first when pulling up a property (Peter's placement instruction,
    // 2026-09-08).
    // ────────────────────────────────────────────────────────────────
    function renderHeader(data) {
      const p = data.property;
      const occ = data.occupancy || { occupied: 0, total: 0 };
      const maintCard = data.cards && data.cards.maintenance;
      const maintenanceNotes = (maintCard && maintCard.status === 'ok') ? maintCard.data.maintenance_notes : null;
      let html = '<div class="card">';
      html += '<div class="ov-header-row"><div>';
      html += '<div class="ov-header-title">' + escapeHtml(p.name || p.address || 'Unnamed property') + '</div>';
      html += '<div class="ov-header-sub">' + escapeHtml(p.address || '') + (p.city ? ', ' + escapeHtml(p.city) : '') + (p.state ? ', ' + escapeHtml(p.state) : '') + '</div>';
      html += '</div><div style="text-align:right;">';
      if (data.owner) {
        html += '<div style="font-size:12.5px;color:#374151;">Owner: ' + escapeHtml(data.owner.name || 'Unnamed') + '</div>';
        const contacts = [data.owner.phone, data.owner.email].filter(Boolean).join(' / ');
        if (contacts) html += '<div style="font-size:11.5px;color:#9ca3af;">' + escapeHtml(contacts) + '</div>';
      } else {
        html += '<div style="font-size:12.5px;color:#9ca3af;">No linked owner on file</div>';
      }
      html += renderHeaderMaintenanceNotes(maintenanceNotes);
      html += '</div></div>';
      if (data.has_owner_history_gap) {
        html += '<div class="ov-owner-note">Showing current ownership only &mdash; this system does not track ownership history.</div>';
      }
      html += '<div class="ov-spend-row">';
      html += '<div><div class="ov-spend-figure">' + occ.occupied + ' of ' + occ.total + '</div><div class="ov-spend-label">Units occupied</div></div>';
      html += '<div><div class="ov-spend-figure">' + (data.next_lease_end ? formatDate(data.next_lease_end) : '&#8212;') + '</div><div class="ov-spend-label">Next lease end</div></div>';
      html += '</div>';
      html += '</div>';
      return html;
    }

    function renderAttentionBanner(needsAttention) {
      if (!needsAttention) return '';
      return '<div class="attention-banner">' + escapeHtml(needsAttention.summary) + '</div>';
    }

    // ────────────────────────────────────────────────────────────────
    // Complaint Tracking — Issues section (product doc Section 2/5:
    // big-deal items only, flat and prominent, no toggle at all). Calls
    // complaint-tracking/router.js's own real routes directly (already
    // built, already gated to admin/director_of_operations) — no change
    // to this page's own aggregate /summary route. GET /api/complaint-
    // tracking/property/:id already queries complaints_needing_attention
    // (is_big_deal, not resolved, not merged, tenant-lease-end auto-
    // dropped), so this section never needs to re-derive "is this still
    // active" logic — it just renders what the route returns.
    // ────────────────────────────────────────────────────────────────
    var CT_CATEGORY_LABELS = {
      legal_compliance: 'Legal / Compliance',
      blocked_resolution: 'Blocked Resolution',
      churn_risk: 'Relationship / Churn Risk',
      escalation_recurrence: 'Escalation / Recurrence',
      major_money_property_risk: 'Major Money / Property Risk',
      owner_instruction_one_off: 'Owner Instruction',
    };
    var CT_STATUS_LABELS = { open: 'Open', in_progress: 'In Progress', blocked: 'Blocked', resolved: 'Resolved', held: 'Held' };
    var CT_SUBJECT_LABELS = { owner: 'Owner', tenant: 'Tenant', team_member: 'Team Member', property: 'Property' };

    // Design Decision 4 — "confirmed refusal" vs. "inferred from silence"
    // must stay visibly distinct wherever a blocked complaint is shown,
    // including here — never one generic "Blocked" badge. Same "2+ days"
    // wording as complaint-tracking/dashboard/index.html's own (the
    // documented, Peter-confirmed blocked_resolution_silence_days value;
    // this page has no route exposing the live config to read instead).
    function ctBlockedBadge(c) {
      if (c.category !== 'blocked_resolution' || !c.blocked_reason) return '';
      var party = c.blocked_party ? (CT_SUBJECT_LABELS[c.blocked_party] || c.blocked_party) : 'Someone';
      return c.blocked_reason === 'explicit_refusal'
        ? '<span class="badge badge-red">Blocked &mdash; ' + escapeHtml(party) + ' Refused</span>'
        : '<span class="badge badge-amber">Blocked &mdash; No Response (2+ days)</span>';
    }

    function ctCard(c) {
      // held_legal_fair_housing, not status — see complaint-tracking/
      // dashboard/index.html's own renderCard comment on why (status
      // becomes 'resolved' once a held item is closed, but the label
      // must stay permanent). In practice complaints_needing_attention
      // already drops a CLOSED held row (status != 'resolved' is part of
      // that view's own filter) — this still checks the real flag rather
      // than assuming, since this section renders whatever the route
      // hands back.
      var isHeld = c.held_legal_fair_housing;
      var subjCls = c.subject_type ? 'subj-' + c.subject_type : (c.needs_matching ? 'subj-unmatched' : '');
      var badges = '<span class="ct-status ct-status-' + c.status + '">' + (CT_STATUS_LABELS[c.status] || c.status) + '</span>';
      if (c.subject_type) {
        var subjectName = (c.display && c.display.subject_name) ? ': ' + escapeHtml(c.display.subject_name) : '';
        badges += ' <span class="badge badge-blue ct-subj">' + (CT_SUBJECT_LABELS[c.subject_type] || c.subject_type) + subjectName + '</span>';
      }
      if (c.category) badges += ' <span class="ct-cat ct-cat-' + c.category + '">' + escapeHtml(CT_CATEGORY_LABELS[c.category] || c.category) + '</span>';
      if (!c.category && c.needs_human_call) badges += ' <span class="badge badge-amber">Needs a Human Call</span>';
      badges += ' ' + ctBlockedBadge(c);
      if (c.tone_trend === 'escalating') badges += ' <span class="badge badge-amber">Tone: Escalating</span>';
      if (c.flagged_protected_class) {
        badges += ' <span class="badge badge-amber">&#9888; Fair Housing flag' + (c.flagged_category ? ': ' + escapeHtml(c.flagged_category) : '') + '</span>';
      }

      var body;
      if (isHeld) {
        var closed = c.resolution_note != null;
        body = '<div class="ct-held-box' + (closed ? ' closed' : '') + '">Held &mdash; Legal / Fair Housing' + (closed ? ' (Closed)' : '') + '</div>' +
          (closed ? '<div class="ct-desc">' + escapeHtml(c.resolution_note) + '</div>' : '<div class="ct-desc empty">Awaiting closure &mdash; handled outside this system, per policy. No content shown here by design.</div>');
      } else {
        body = c.description ? '<div class="ct-desc">' + escapeHtml(c.description) + '</div>' : '<div class="ct-desc empty">No description on file.</div>';
      }

      return '<div class="ct-card ' + subjCls + (isHeld ? ' is-held' : '') + '">' +
        '<div class="ct-top"><div class="ct-badges">' + badges + '</div><div class="ct-date">' + formatDate(c.created_at) + '</div></div>' +
        body +
        '<a class="ct-link" href="/complaint-tracking">Open in Complaint Tracking &rarr;</a>' +
        '</div>';
    }

    // Owner-tied vs. tenant-tied visual separation (product doc Section
    // 4), same grouping this Hub's central Complaint Tracking tool uses —
    // kept consistent rather than inventing a second layout for the same
    // requirement.
    function ctGroupsHtml(items) {
      var groups = { owner: [], tenant: [], other: [] };
      items.forEach(function (c) {
        if (c.subject_type === 'owner') groups.owner.push(c);
        else if (c.subject_type === 'tenant') groups.tenant.push(c);
        else groups.other.push(c);
      });
      var html = '';
      if (groups.owner.length) html += '<div class="ct-group-heading owner"><span class="dot"></span>Owner-Tied</div>' + groups.owner.map(ctCard).join('');
      if (groups.tenant.length) html += '<div class="ct-group-heading tenant"><span class="dot"></span>Tenant-Tied</div>' + groups.tenant.map(ctCard).join('');
      if (groups.other.length) html += '<div class="ct-group-heading other"><span class="dot"></span>Other</div>' + groups.other.map(ctCard).join('');
      return html;
    }

    // Entirely self-contained: checks this tool's own /auth/me first and
    // only ever mounts real markup on success, same "no hint it exists to
    // anyone without access" discipline as wireOwnerTenantNotesSection
    // below — the difference is this page's own aggregate /summary route
    // has no complaint_tracking key to gate on (property-360/router.js is
    // untouched by this build), so the check happens here instead of
    // being inherited from that response.
    function loadComplaintTrackingSection(propertyId, mountEl) {
      fetch('/api/complaint-tracking/auth/me', { credentials: 'include' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (me) {
          if (!me) return; // no access — mount stays empty, no hint this section exists
          return fetch('/api/complaint-tracking/property/' + encodeURIComponent(propertyId), { credentials: 'include' })
            .then(function (r) { return r.ok ? r.json() : { complaints: [] }; })
            .then(function (body) {
              var items = body.complaints || [];
              var heldItems = items.filter(function (c) { return c.held_legal_fair_housing; });
              var others = items.filter(function (c) { return !c.held_legal_fair_housing; });
              var html = '<div class="card ct-section"><div class="section-title">Issues (Complaint Tracking)</div>';
              if (!items.length) {
                html += '<p class="sub" style="margin:4px 0 0;">No big-deal complaints on file for this property right now.</p>';
              } else {
                if (heldItems.length) {
                  html += '<div class="ct-group-heading"><span class="dot" style="background:#111827;"></span>Held &mdash; Legal / Fair Housing</div>' + heldItems.map(ctCard).join('');
                }
                html += ctGroupsHtml(others);
              }
              html += '</div>';
              if (mountEl && mountEl.parentNode) mountEl.outerHTML = html;
            });
        })
        .catch(function () { /* role lookup or data fetch failed — section stays absent, rest of the page still works */ });
    }

    // ────────────────────────────────────────────────────────────────
    // Insurance card — days/badge conventions copied from
    // insurance/dashboard/index.html's own statusBadge()/daysCell()
    // exactly, since this is the same status vocabulary.
    // ────────────────────────────────────────────────────────────────
    const INSURANCE_STATUS_MAP = {
      compliant:              ['badge-compliant',              'Compliant'],
      expiring_soon:          ['badge-expiring_soon',          'Expiring Soon'],
      expired:                ['badge-expired',                'Expired'],
      pending_review:         ['badge-pending_review',         'Pending Review'],
      escalated:              ['badge-escalated',               'Escalated'],
      no_policy:               ['badge-no_policy',              'No Policy'],
      insufficient_liability:  ['badge-insufficient_liability', '&#9888; Low Liability'],
      no_additional_insured:   ['badge-no_additional_insured',  '&#9888; No Add&apos;l Insured'],
    };
    function insuranceStatusBadge(status) {
      const entry = INSURANCE_STATUS_MAP[status] || ['badge-unknown', 'Unknown'];
      return '<span class="badge ' + entry[0] + '">' + entry[1] + '</span>';
    }
    function daysCellExpiration(days) {
      if (days == null) return '<span class="days-gray">&#8212;</span>';
      if (days === 0) return '<span class="days-red">Today</span>';
      if (days < 0) return '<span class="days-red">' + days + ' days</span>';
      if (days <= 30) return '<span class="days-amber">' + days + ' days</span>';
      return '<span class="days-green">' + days + ' days</span>';
    }

    function renderInsuranceCard(card, property) {
      if (!card) return '';
      let body;
      if (card.status === 'error') {
        body = '<div class="empty" style="padding:8px 0;">Couldn\'t load this right now.</div>';
      } else if (card.status === 'no_data') {
        body = '<div class="empty" style="padding:8px 0;">No records yet.</div>';
      } else {
        const d = card.data;
        body = '<div class="fact">' + insuranceStatusBadge(d.status) + '</div>';
        if (d.days_until_expiration != null) {
          body += '<div class="fact"><span class="fl">Expires:</span> ' + daysCellExpiration(d.days_until_expiration) + '</div>';
        }
        if (d.coverage_amount != null) {
          body += '<div class="fact"><span class="fl">Coverage:</span> ' + formatCurrency(d.coverage_amount) +
            (d.below_minimum ? ' <span class="badge badge-amber">below $500K min</span>' : '') + '</div>';
        }
        body += '<div class="fact"><span class="fl">Add&apos;l insured:</span> ' + (d.additional_insured_verified ? 'Verified' : 'Not verified') + '</div>';
        if (d.insurer_name) body += '<div class="sub-line">' + escapeHtml(d.insurer_name) + '</div>';
        body += '<a class="card-link" href="/insurance?property=' + encodeURIComponent(propertyLabel(property)) + '">View in Insurance Compliance &rarr;</a>';
      }
      return '<div class="card summary-card" id="card-insurance"><h3>Insurance</h3>' + body + '</div>';
    }

    // ────────────────────────────────────────────────────────────────
    // Security Deposit card — badge/day conventions copied from
    // security-deposit/dashboard/index.html's own statusBadge()/
    // daysInfo()/tenancy-badge helpers exactly.
    // ────────────────────────────────────────────────────────────────
    function sdStatusBadge(status) {
      const map = { pending_review: ['badge-pending_review', 'Pending Review'], escalated: ['badge-escalated', 'Escalated'], reviewed: ['badge-reviewed', 'Reviewed'] };
      const entry = map[status] || ['badge-pending_review', status || 'Unknown'];
      return '<span class="badge ' + entry[0] + '">' + entry[1] + '</span>';
    }
    function tenancyBadge(status) {
      if (status === 'full_tenancy_ending') return '<span class="badge badge-full_tenancy_ending">Full tenancy ending</span>';
      if (status === 'partial_co_tenant_move_out') return '<span class="badge badge-partial_co_tenant_move_out">Co-tenant moving out &mdash; lease continues</span>';
      return '<span class="badge badge-tenancy-unconfirmed">&#9888; Not yet confirmed</span>';
    }
    function daysInfoDeadline(n) {
      if (n == null) return { text: '&#8212;', cls: 'days-gray' };
      if (n < 0) return { text: Math.abs(n) + ' day' + (Math.abs(n) === 1 ? '' : 's') + ' OVERDUE', cls: 'days-red' };
      if (n === 0) return { text: 'Due today', cls: 'days-red' };
      if (n <= 3) return { text: n + ' day' + (n === 1 ? '' : 's') + ' left', cls: 'days-red' };
      if (n <= 7) return { text: n + ' days left', cls: 'days-amber' };
      return { text: n + ' days left', cls: 'days-green' };
    }

    function renderSecurityDepositCard(card, property) {
      if (!card) return '';
      let body;
      if (card.status === 'error') {
        body = '<div class="empty" style="padding:8px 0;">Couldn\'t load this right now.</div>';
      } else if (card.status === 'no_data') {
        body = '<div class="empty" style="padding:8px 0;">No records yet.</div>';
      } else {
        const d = card.data;
        body = '<div class="fact">' + sdStatusBadge(d.status) + '</div>';
        const info = daysInfoDeadline(d.days_remaining);
        body += '<div class="fact"><span class="fl">21-day deadline:</span> <span class="' + info.cls + '">' + info.text + '</span></div>';
        body += '<div class="fact"><span class="fl">Tenancy:</span> ' + tenancyBadge(d.tenancy_status) + '</div>';
        if (typeof d.open_flags_count === 'number') {
          body += '<div class="fact"><span class="fl">Open flags:</span> ' + d.open_flags_count + '</div>';
        }
        body += '<a class="card-link" href="/security-deposit?property=' + encodeURIComponent(propertyLabel(property)) + '">View in Security Deposit &rarr;</a>';
      }
      return '<div class="card summary-card" id="card-security_deposit"><h3>Security Deposit</h3>' + body + '</div>';
    }

    // ────────────────────────────────────────────────────────────────
    // LeadSimple card — stage name only, v1 (property-360-SPEC.md's
    // LeadSimple section). No drill-through link for v1 — LeadSimple's
    // web app isn't confirmed to support a stable per-record URL.
    // ────────────────────────────────────────────────────────────────
    function renderLeadSimpleCard(card) {
      if (!card) return '';
      let body;
      if (card.status === 'error') {
        body = '<div class="empty" style="padding:8px 0;">Couldn\'t load this right now.</div>';
      } else {
        const d = card.status === 'ok' ? card.data : null;
        const rows = [];
        if (d && d.delinquency_stage) rows.push(['Delinquency', d.delinquency_stage, d.delinquency_stage === 'Eviction']);
        if (d && d.lease_renewal_stage) rows.push(['Lease Renewal', d.lease_renewal_stage, false]);
        if (d && d.move_out_stage) rows.push(['Move Out', d.move_out_stage, false]);
        if (!rows.length) {
          body = '<div class="empty" style="padding:8px 0;">No open Delinquency, Lease Renewal, or Move Out process.</div>';
        } else {
          body = rows.map(function (r) {
            return '<div class="fact"><span class="fl">' + r[0] + ':</span> ' + escapeHtml(r[1]) + (r[2] ? ' <span class="badge badge-red">Needs attention</span>' : '') + '</div>';
          }).join('');
        }
      }
      return '<div class="card summary-card" id="card-leadsimple"><h3>LeadSimple</h3>' + body + '</div>';
    }

    const CARD_RENDERERS = {
      insurance: renderInsuranceCard,
      security_deposit: renderSecurityDepositCard,
      leadsimple: renderLeadSimpleCard,
    };

    // ────────────────────────────────────────────────────────────────
    // Maintenance "where the money went" pie chart — repair-type
    // breakdown, 2026-09. `d.spend_by_category` (maintenance-history/
    // router.js's getMaintenanceHistoryPropertySummary) already groups
    // dollars by category and sorts largest-first; this just draws it.
    // Category is inferred server-side from the VENDOR'S NAME ONLY
    // (categorizeMaintenanceVendor in that file) — never from any
    // ticket/bill free text — so this chart never touches a field the
    // Fair Housing privacy-review pipeline gates.
    //
    // MAINTENANCE_CATEGORY_COLORS is a FIXED color per category, not
    // reassigned by a property's own rank (dataviz skill: "color
    // follows the entity, never its rank"). Ordered here by
    // portfolio-wide dollar rank as of the original 2026-09-03 build;
    // the first 8 are the dataviz skill's own documented categorical
    // palette, validated CVD-safe as adjacent neighbors in this exact
    // order (scripts/validate_palette.js, run 2026-09-03 — see this
    // build's report). The remaining entries extend it for the real
    // properties whose 5-year history spans more than 8 repair types
    // (live-checked: up to 14 categories on one property) — past the
    // skill's stated 8-series ceiling for a guaranteed-safe pairwise
    // adjacency, so exact colorblind separation isn't promised for
    // slots 9+. The always-present legend below (swatch + category
    // name + dollar amount + percentage, same order as the slices) is
    // the deliberate mitigation for that — color is never the only way
    // to tell two slices apart, per the skill's own "identity is never
    // color alone" rule. New categories are APPENDED, never inserted
    // earlier or re-ranked — an existing category's color must never
    // change out from under it just because another category's dollar
    // total shifted (e.g. 'Other / Handyman' would otherwise have
    // dropped from #1 to #3 the moment 'Handyman, Turnover &
    // Preventative Maint.' below was split out of it, 2026-09-04).
    const MAINTENANCE_CATEGORY_COLORS = {
      'Other / Handyman': '#2a78d6',
      'Plumbing': '#eb6834',
      'Maintenance Coordination Fee': '#1baf7a',
      'Cleaning': '#eda100',
      'Roofing': '#e87ba4',
      'HVAC': '#008300',
      'Flooring': '#4a3aa7',
      'Doors, Windows & Glass': '#e34948',
      'Restoration & Water Damage': '#0d9488',
      'Painting': '#4338ca',
      'Pest Control': '#0891b2',
      'Locksmith': '#c026d3',
      'Electrical': '#e11d48',
      'Landscaping & Tree Service': '#65a30d',
      'Appliance Repair': '#92400e',
      'Fireplace & Chimney': '#ca8a04',
      'Fencing': '#6b21a8',
      // Added 2026-09-04 (Quick Turn Maintenance vendor fix, see
      // maintenance-history/router.js's categorizeMaintenanceVendor).
      // #0ea5e9 chosen and validated with scripts/validate_palette.js
      // (dataviz skill) appended as slot 18, light mode, surface
      // #ffffff (this card's actual background) — ALL CHECKS PASS
      // against the existing 17, no new FAIL introduced; worst-case
      // separation from any existing category (Pest Control, the
      // nearest hue) is well clear of the hard-fail floors.
      'Handyman, Turnover & Preventative Maint.': '#0ea5e9',
    };
    // Guards a future category name added server-side (categorizeMaintenanceVendor)
    // without a matching color added here — should never actually show.
    const MAINTENANCE_CATEGORY_FALLBACK_COLOR = '#9ca3af';

    function renderMaintenancePieChart(rows) {
      if (!rows || !rows.length) return ''; // No spend data to chart.
      const total = rows.reduce(function (sum, r) { return sum + r.amount; }, 0);
      if (!total) return '';

      const cx = 70, cy = 70, r = 65;
      let slicesSvg = '';
      if (rows.length === 1) {
        // A single category is 100% of the pie — the wedge math below
        // degenerates to a zero-length arc (same start/end point) for a
        // full circle, so draw a plain circle instead.
        const color = MAINTENANCE_CATEGORY_COLORS[rows[0].category] || MAINTENANCE_CATEGORY_FALLBACK_COLOR;
        slicesSvg = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + color + '"></circle>';
      } else {
        let cumulative = 0;
        for (const row of rows) {
          const fraction = row.amount / total;
          const startAngle = -Math.PI / 2 + cumulative * 2 * Math.PI;
          cumulative += fraction;
          const endAngle = -Math.PI / 2 + cumulative * 2 * Math.PI;
          const x1 = cx + r * Math.cos(startAngle), y1 = cy + r * Math.sin(startAngle);
          const x2 = cx + r * Math.cos(endAngle), y2 = cy + r * Math.sin(endAngle);
          const largeArc = (endAngle - startAngle) > Math.PI ? 1 : 0;
          const color = MAINTENANCE_CATEGORY_COLORS[row.category] || MAINTENANCE_CATEGORY_FALLBACK_COLOR;
          slicesSvg += '<path d="M' + cx + ',' + cy + ' L' + x1.toFixed(2) + ',' + y1.toFixed(2) +
            ' A' + r + ',' + r + ' 0 ' + largeArc + ',1 ' + x2.toFixed(2) + ',' + y2.toFixed(2) +
            ' Z" fill="' + color + '" stroke="#fff" stroke-width="2"></path>';
        }
      }

      const legendRows = rows.map(function (row) {
        const color = MAINTENANCE_CATEGORY_COLORS[row.category] || MAINTENANCE_CATEGORY_FALLBACK_COLOR;
        return '<div class="pie-legend-row">' +
          '<span class="pie-swatch" style="background:' + color + ';"></span>' +
          '<span class="pie-legend-cat">' + escapeHtml(row.category) + '</span>' +
          '<span class="pie-legend-amt">' + formatMoney(row.amount) + ' &middot; ' + row.percent.toFixed(1) + '%</span>' +
          '</div>';
      }).join('');

      return '<div class="fact" style="margin-top:12px;"><span class="fl">Where the money went:</span></div>' +
        '<div class="pie-wrap">' +
        '<svg viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="Maintenance spend by repair type">' + slicesSvg + '</svg>' +
        '<div class="pie-legend">' + legendRows + '</div>' +
        '</div>';
    }

    // ────────────────────────────────────────────────────────────────
    // Maintenance summary — same glance shape as the cards above, but
    // rendered inline inside the Maintenance section rather than the
    // card grid (property-360-SPEC.md: "Maintenance becomes small-
    // card-plus-two-full-sections... all on one page").
    // ────────────────────────────────────────────────────────────────
    function renderMaintenanceSummary(card) {
      if (card.status === 'error') return '<div class="empty" style="padding:8px 0;">Couldn\'t load this right now.</div>';
      if (card.status === 'no_data') return '<div class="empty" style="padding:8px 0;">No maintenance ticket data synced for this property yet.</div>';
      const d = card.data;
      let html = '<div class="ov-spend-row" style="margin-top:0;">';
      // Open tickets — clickable/expandable when there's something to
      // show, using the exact same details/summary collapsible pattern
      // (arrow marker, lazy-loaded body) as the Maintenance History
      // Snapshot / Needs Privacy Review subsections below, not a new
      // pattern. Plain text with no toggle when open_ticket_count is 0 —
      // nothing to expand into.
      if (d.open_ticket_count > 0) {
        html += '<div><details class="subsection ov-open-tickets" id="open-tickets-details">' +
          '<summary><span class="ov-spend-figure">' + d.open_ticket_count + '</span><span class="ov-spend-label">Open tickets</span></summary>' +
          '<div class="subsection-body" id="open-tickets-body"></div>' +
          '</details></div>';
      } else {
        html += '<div><div class="ov-spend-figure">0</div><div class="ov-spend-label">Open tickets</div></div>';
      }
      html += '<div><div class="ov-spend-figure">' + formatMoney(d.spend_trailing_12mo) + '</div><div class="ov-spend-label">Spend, trailing 12mo</div></div>';
      html += '</div>';
      html += '<div class="fact" style="margin-top:12px;"><span class="fl">Last activity:</span> ' + (d.last_activity ? formatDate(d.last_activity) : '&#8212;') + '</div>';
      if (d.vendor_count) {
        html += '<div class="fact"><span class="fl">Vendors used:</span> ' + d.vendor_count +
          (d.most_recent_vendor_name ? ', most recent: ' + escapeHtml(d.most_recent_vendor_name) : '') + '</div>';
      }
      html += renderMaintenancePieChart(d.spend_by_category);
      // AppFolio actual maintenance-category spend — separate from the
      // Latchel-ticket figures above on purpose: it's sourced from
      // AppFolio's own general ledger (can include repair/maintenance
      // spend that never went through a Latchel ticket at all), and it
      // covers the current fiscal year, not the trailing-12mo window the
      // ticket spend figure above uses. Only shown once tracking has
      // actually started for this property (has_appfolio_actual_data) —
      // same real-$0-vs-not-tracked distinction the Budget tab already
      // uses, so a genuine $0 here still renders (honestly), while a
      // property AppFolio has never synced actuals for stays silent.
      if (d.has_appfolio_actual_data) {
        html += '<div class="fact" style="margin-top:8px;"><span class="fl">AppFolio repair/maintenance spend (this year):</span> ' + formatMoney(d.appfolio_maintenance_spend) + '</div>';
      }
      // Gated flag — only ever present in the API response at all for a
      // viewer in PRIVACY_REVIEW_ROLES (maintenance-history/router.js
      // omits the key entirely for anyone else, and omits it on a real
      // zero too), so this line inherits that same "nobody else sees
      // any hint that field exists" guarantee for free.
      if (d.flagged_review_count) {
        html += '<div class="fact" style="margin-top:8px;"><a href="#" class="prop-link" id="jump-privacy-review">' +
          d.flagged_review_count + ' item' + (d.flagged_review_count === 1 ? '' : 's') + ' ' + (d.flagged_review_count === 1 ? 'needs' : 'need') + ' privacy review &rarr;</a></div>';
      }
      return html;
    }

    // ────────────────────────────────────────────────────────────────
    // Privacy Review subsection — reused, near-verbatim, from
    // maintenance-history/dashboard's own claim rendering (renderClaim,
    // reviewBadge, correct/reject forms) and loadFlagged() (the
    // acknowledgment gate, the property filter). Pre-filtered to this
    // property via ?property_id=. Resolved 2026-09-02: reviewed items
    // drop out of the default view; "Show reviewed items" (default off,
    // per Mason's condition 1) removes that filter.
    //
    // WHO EVEN SEES THIS SUBSECTION AT ALL: gated client-side by the
    // caller (see maintenanceSectionLoaded() below) using the real
    // Maintenance History role from GET /api/maintenance-history/auth/me
    // — NOT just "a Maintenance card is present." A maintenance card
    // only proves requireMaintenanceHistoryAccess (ANY role — includes
    // property_manager/inspection_coordinator/pod_lead); Privacy Review
    // itself is gated one level narrower, to admin/reviewer/
    // director_of_operations only (PRIVACY_REVIEW_ROLES). Rendering
    // this section for everyone with a Maintenance card and just letting
    // the fetch below 403 would still have revealed the mere EXISTENCE
    // of a "needs privacy review" workflow to a role that was never
    // vetted for that content — exactly the "nobody else sees any hint
    // that field exists" guarantee the spec's own summary-card bullet
    // states for flagged_review_count, extended here to the section
    // itself. /auth/me is the same, already-gated, side-effect-free
    // lookup the (now-retiring) Maintenance History dashboard already
    // used for this exact purpose — reused here rather than guessed at
    // fresh. Deliberately NOT probed via flagged-queue itself: that
    // route writes a real audit_log "viewed" entry on every call
    // (router.js:1122-1156), so eagerly calling it just to check access
    // would defeat both this section's own "collapsed by default, lazy-
    // loaded" intent and generate a spurious view record before anyone
    // actually chose to look.
    // ────────────────────────────────────────────────────────────────
    const PRIVACY_REVIEW_ROLES = ['admin', 'reviewer', 'director_of_operations'];
    const OUTCOME_LABELS = { 1: 'Vendor says done', 2: 'Function restored', 3: 'Resident confirmed', 4: 'No recurrence in window', 5: 'Verified by later inspection' };

    function reviewBadge(status) {
      const map = { unreviewed: 'badge-amber', confirmed: 'badge-green', corrected: 'badge-blue', rejected: 'badge-red' };
      return '<span class="badge ' + (map[status] || 'badge-gray') + '">' + escapeHtml(status) + '</span>';
    }

    function renderPrivacyClaim(c) {
      let meta = reviewBadge(c.review_status);
      if (c.claim_date) meta += '<span>' + escapeHtml(c.claim_date) + '</span>';
      if (c.claim_type === 'outcome' && c.outcome_level) meta += '<span class="badge badge-blue">Level ' + c.outcome_level + ' &mdash; ' + (OUTCOME_LABELS[c.outcome_level] || '') + '</span>';
      if (c.confidence != null) meta += '<span>confidence ' + Math.round(c.confidence * 100) + '%</span>';
      meta += '<span class="claim-source">source: ' + escapeHtml(c.source_reference || '') + '</span>';

      let html = '<div class="claim" id="claim-' + escapeHtml(c.id) + '">';
      html += '<div class="claim-meta" style="margin-bottom:2px;">' + escapeHtml(c.property_name || '') +
        (c.unit_number ? ' &middot; Unit ' + escapeHtml(c.unit_number) : '') +
        (c.ticket_title ? ' &middot; ' + escapeHtml(c.ticket_title) : '') + '</div>';
      html += '<div class="claim-text">' + escapeHtml(c.claim_text) + '</div>';
      html += '<div class="claim-meta">' + meta + '</div>';

      if (c.review_status === 'unreviewed') {
        html += '<div class="claim-actions">';
        html += '<button class="btn btn-confirm" data-action="confirm" data-claim-id="' + escapeHtml(c.id) + '">Confirm</button>';
        html += '<button class="btn btn-correct" data-action="toggle-correct" data-claim-id="' + escapeHtml(c.id) + '">Correct</button>';
        html += '<button class="btn btn-reject" data-action="toggle-reject" data-claim-id="' + escapeHtml(c.id) + '">Reject</button>';
        html += '</div>';
        html += '<div class="correct-form" id="correct-form-' + c.id + '">';
        html += '<div class="form-hint">Edit the text below, then click Save correction to save.</div>';
        html += '<textarea id="correct-text-' + c.id + '">' + escapeHtml(c.claim_text) + '</textarea>';
        html += '<input type="date" id="correct-date-' + c.id + '" value="' + escapeHtml(c.claim_date || '') + '">';
        if (c.claim_type === 'outcome') {
          html += '<input type="number" min="1" max="5" id="correct-outcome-' + c.id + '" placeholder="Outcome level 1-5" value="' + (c.outcome_level || '') + '">';
        }
        html += '<input type="text" id="correct-notes-' + c.id + '" placeholder="Reviewer notes (optional)">';
        html += '<button class="btn btn-correct" data-action="correct" data-claim-id="' + escapeHtml(c.id) + '">Save correction</button>';
        html += '</div>';
        html += '<div class="correct-form" id="reject-form-' + c.id + '">';
        html += '<div class="form-hint">Add a note, then click Confirm reject to save.</div>';
        html += '<input type="text" id="reject-notes-' + c.id + '" placeholder="Reason for rejecting (optional)">';
        html += '<button class="btn btn-reject" data-action="reject" data-claim-id="' + escapeHtml(c.id) + '">Confirm reject</button>';
        html += '</div>';
      } else {
        html += '<div class="form-hint">Reviewed by ' + escapeHtml(c.reviewed_by || 'unknown') + (c.reviewed_at ? ' on ' + formatDate(c.reviewed_at) : '') + '</div>';
      }
      html += '</div>';
      return html;
    }

    // Governance fix, 2026-09-03: flagged maintenance_snapshot_events rows
    // now come back in the same GET /flagged-queue response as claims
    // (item_type: 'snapshot_event' vs 'claim' — see router.js's own
    // comment on that route). Rendered here as a sibling to
    // renderPrivacyClaim above rather than folded into it: the two tables
    // don't share a field shape (summary/event_date/amount/vendor_name
    // here vs. claim_type/claim_text/claim_date/outcome_level there).
    // Deliberately reuses the SAME element id convention as
    // renderPrivacyClaim (correct-text-<id> / correct-date-<id> /
    // correct-notes-<id>) — a claim id and a snapshot-event id are
    // different UUID spaces and never both render for the same id at
    // once, so this lets handlePrivacyAction below read the form values
    // with the exact same lookups for both, branching only on what it
    // sends, not how it reads the form.
    function renderPrivacySnapshotEvent(s) {
      let meta = reviewBadge(s.review_status);
      if (s.event_date) meta += '<span>' + escapeHtml(s.event_date) + '</span>';
      meta += '<span>' + formatMoney(s.amount) + '</span>';
      if (s.vendor_name) meta += '<span>' + escapeHtml(s.vendor_name) + '</span>';
      meta += '<span class="claim-source">source: ' + escapeHtml(s.source_reference || '') + '</span>';

      let html = '<div class="claim" id="claim-' + escapeHtml(s.id) + '">';
      html += '<div class="claim-meta" style="margin-bottom:2px;">' + escapeHtml(s.property_name || '') + ' &middot; AppFolio bill history</div>';
      html += '<div class="claim-text">' + escapeHtml(s.summary) + '</div>';
      html += '<div class="claim-meta">' + meta + '</div>';

      if (s.review_status === 'unreviewed') {
        html += '<div class="claim-actions">';
        html += '<button class="btn btn-confirm" data-action="confirm" data-item-type="snapshot_event" data-claim-id="' + escapeHtml(s.id) + '">Confirm</button>';
        html += '<button class="btn btn-correct" data-action="toggle-correct" data-item-type="snapshot_event" data-claim-id="' + escapeHtml(s.id) + '">Correct</button>';
        html += '<button class="btn btn-reject" data-action="toggle-reject" data-item-type="snapshot_event" data-claim-id="' + escapeHtml(s.id) + '">Reject</button>';
        html += '</div>';
        html += '<div class="correct-form" id="correct-form-' + s.id + '">';
        html += '<div class="form-hint">Edit the summary below, then click Save correction to save.</div>';
        html += '<textarea id="correct-text-' + s.id + '" maxlength="300">' + escapeHtml(s.summary) + '</textarea>';
        html += '<input type="date" id="correct-date-' + s.id + '" value="' + escapeHtml(s.event_date || '') + '">';
        html += '<input type="text" id="correct-notes-' + s.id + '" placeholder="Reviewer notes (optional)">';
        html += '<button class="btn btn-correct" data-action="correct" data-item-type="snapshot_event" data-claim-id="' + escapeHtml(s.id) + '">Save correction</button>';
        html += '</div>';
        html += '<div class="correct-form" id="reject-form-' + s.id + '">';
        html += '<div class="form-hint">Add a note, then click Confirm reject to save.</div>';
        html += '<input type="text" id="reject-notes-' + s.id + '" placeholder="Reason for rejecting (optional)">';
        html += '<button class="btn btn-reject" data-action="reject" data-item-type="snapshot_event" data-claim-id="' + escapeHtml(s.id) + '">Confirm reject</button>';
        html += '</div>';
      } else {
        html += '<div class="form-hint">Reviewed by ' + escapeHtml(s.reviewed_by || 'unknown') + (s.reviewed_at ? ' on ' + formatDate(s.reviewed_at) : '') + '</div>';
      }
      html += '</div>';
      return html;
    }

    // Grouped-review view (flagged-review-grouping-and-exclusions-SPEC.md
    // Part 1), same feature as maintenance-history/dashboard's own
    // Needs-Privacy-Review tab, extended here per condition 7. Holds the
    // most recently fetched cluster array for this section, so the
    // cluster button handlers below (wired by index, not id) can look up
    // a cluster's real items — router.js still re-verifies every id fresh
    // at bulk-review time regardless of what this holds, so a stale copy
    // here is only ever a UX convenience, never a source of truth.
    let lastPrivacyClusters = [];

    function renderPrivacyItem(item) {
      return item.item_type === 'snapshot_event' ? renderPrivacySnapshotEvent(item) : renderPrivacyClaim(item);
    }

    // One card per cluster — sample line, count, and (only when
    // bulk_eligible — condition 3) Confirm-all/Reject-all. "View
    // individually" expands into the cluster's real items via
    // renderPrivacyItem above, unchanged (condition 7 — no new per-item
    // render logic). Distinct data-cluster-action attribute (not
    // data-action) so these buttons can be wired separately from the
    // per-item Confirm/Correct/Reject buttons handlePrivacyAction already
    // owns — both kinds of button coexist once a cluster is expanded.
    function renderPrivacyClusters(clusters) {
      return clusters.map(function (cluster, idx) {
        let html = '<div class="claim">';
        html += '<div class="claim-meta" style="margin-bottom:2px;">' +
          '<span class="badge badge-gray">' + cluster.count + ' item' + (cluster.count === 1 ? '' : 's') + '</span>' +
          '<span>' + escapeHtml(cluster.category) + '</span>' +
          (cluster.matched_term
            ? '<span class="badge badge-blue">matched: &ldquo;' + escapeHtml(cluster.matched_term) + '&rdquo;</span>'
            : '<span class="badge badge-amber">AI judgment &mdash; no shared keyword</span>') +
          '</div>';
        html += '<div class="claim-text">' + escapeHtml(cluster.sample_text) + '</div>';
        html += '<div class="claim-actions">';
        if (cluster.bulk_eligible) {
          html += '<button class="btn btn-confirm" data-cluster-action="bulk-confirm" data-cluster-index="' + idx + '">Confirm all ' + cluster.count + '</button>';
          html += '<button class="btn btn-reject" data-cluster-action="bulk-reject" data-cluster-index="' + idx + '">Reject all ' + cluster.count + '</button>';
        } else {
          html += '<span class="form-hint" style="margin-bottom:0;">No shared keyword across this group &mdash; review individually.</span>';
        }
        html += '<button class="btn btn-correct" id="privacy-cluster-toggle-' + idx + '" data-cluster-action="toggle-expand" data-cluster-index="' + idx + '">View individually</button>';
        html += '</div>';
        html += '<div class="correct-form" id="privacy-cluster-expand-' + idx + '"></div>';
        html += '</div>';
        return html;
      }).join('');
    }

    // Pure render/toggle — does NOT wire the expanded items' own
    // Confirm/Correct/Reject buttons itself (it has no propertyId/bodyEl/
    // includeReviewed of its own to hand handlePrivacyAction). The caller
    // (loadPrivacyReview's cluster-button click handler below, which does
    // have those in scope via closure) wires them right after calling
    // this, the same run through the event loop.
    function togglePrivacyClusterExpand(idx) {
      const el = document.getElementById('privacy-cluster-expand-' + idx);
      const btn = document.getElementById('privacy-cluster-toggle-' + idx);
      const isOpen = el.classList.toggle('visible');
      if (btn) btn.textContent = isOpen ? 'Hide individual items' : 'View individually';
      if (isOpen && !el.dataset.rendered) {
        const cluster = lastPrivacyClusters[idx];
        el.innerHTML = cluster ? cluster.items.map(renderPrivacyItem).join('') : '';
        el.dataset.rendered = '1';
      }
    }

    async function loadPrivacyReview(propertyId, bodyEl, includeReviewed, grouped) {
      bodyEl.innerHTML = '<div class="empty">Loading&hellip;</div>';
      const url = '/api/maintenance-history/flagged-queue?property_id=' + encodeURIComponent(propertyId) +
        (includeReviewed ? '&include_reviewed=true' : '') + (grouped ? '&grouped=true' : '');
      let res, body;
      try {
        res = await fetch(url, { credentials: 'include' });
        body = await res.json();
      } catch (e) {
        bodyEl.innerHTML = '<div class="empty">Couldn\'t load privacy review right now.</div>';
        return;
      }

      // Acknowledgment gate — Mason's condition 1, director_of_operations
      // only. admin/reviewer never hit this branch.
      if (res.status === 403 && body && body.error === 'privacy_queue_acknowledgment_required') {
        bodyEl.innerHTML =
          '<div class="ack-gate-title">Before you continue</div>' +
          '<div class="ack-gate-body">' + escapeHtml(body.message) + '</div>' +
          '<button class="btn btn-confirm" id="privacy-ack-btn">I acknowledge &mdash; continue</button>';
        document.getElementById('privacy-ack-btn').addEventListener('click', async function () {
          const btn = this;
          btn.disabled = true;
          btn.textContent = 'Saving…';
          try {
            const ackRes = await fetch('/api/maintenance-history/privacy-queue/acknowledge', { method: 'POST', credentials: 'include' });
            if (ackRes.ok) {
              loadPrivacyReview(propertyId, bodyEl, includeReviewed, grouped);
            } else {
              const ackBody = await ackRes.json().catch(function () { return {}; });
              alert(ackBody.error || 'Could not save acknowledgment.');
              btn.disabled = false;
              btn.textContent = 'I acknowledge — continue';
            }
          } catch (e) {
            alert('Network error.');
            btn.disabled = false;
            btn.textContent = 'I acknowledge — continue';
          }
        });
        return;
      }

      if (!res.ok) {
        bodyEl.innerHTML = '<div class="empty">Couldn\'t load privacy review right now.</div>';
        return;
      }

      // Flat mode: body is the row array itself (unchanged shape).
      // Grouped mode (&grouped=true): body is { grouped, total_items, clusters }.
      const rows = grouped ? (body.clusters || []) : (body || []);
      if (grouped) lastPrivacyClusters = body.clusters || [];

      let html = '<div class="toggle-row">' +
        '<label><input type="checkbox" id="include-reviewed-toggle" ' + (includeReviewed ? 'checked' : '') + '> Show reviewed items</label>' +
        '<label style="margin-left:16px;"><input type="checkbox" id="grouped-toggle" ' + (grouped ? 'checked' : '') + '> Group similar items</label>' +
        '</div>';
      if (!rows.length) {
        html += '<div class="empty">' + (includeReviewed ? 'No flagged items ever, for this property.' : 'Nothing needs review right now.') + '</div>';
      } else if (grouped) {
        html += renderPrivacyClusters(rows);
      } else {
        // item_type ('claim' / 'snapshot_event') — governance fix,
        // 2026-09-03. See renderPrivacySnapshotEvent's own comment above.
        html += rows.map(renderPrivacyItem).join('');
      }
      bodyEl.innerHTML = html;

      document.getElementById('include-reviewed-toggle').addEventListener('change', function (e) {
        loadPrivacyReview(propertyId, bodyEl, e.target.checked, grouped);
      });
      document.getElementById('grouped-toggle').addEventListener('change', function (e) {
        loadPrivacyReview(propertyId, bodyEl, includeReviewed, e.target.checked);
      });
      bodyEl.querySelectorAll('[data-action]').forEach(function (btn) {
        btn.addEventListener('click', function () { handlePrivacyAction(this, propertyId, bodyEl, includeReviewed, grouped); });
      });
      bodyEl.querySelectorAll('[data-cluster-action]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const idx = Number(this.dataset.clusterIndex);
          if (this.dataset.clusterAction === 'toggle-expand') {
            togglePrivacyClusterExpand(idx);
            // Individual items inside a just-expanded cluster need the
            // same Confirm/Correct/Reject wiring as the flat list's own
            // items — wire them the moment they're first rendered.
            const expandEl = document.getElementById('privacy-cluster-expand-' + idx);
            expandEl.querySelectorAll('[data-action]').forEach(function (itemBtn) {
              if (itemBtn.dataset.wired) return;
